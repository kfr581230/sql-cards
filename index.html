    { id: 'functions-ref-01', type: 'concept', tag: 'term',
      term: 'COUNT(*)',
      def: `Returns a bigint: the number of rows in each group (or in the whole result without GROUP BY). It counts rows regardless of NULLs, and returns 0 for an empty set.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `Count orders per customer, or how many rides a rider took, to find busy customers or compare cities.`,
      syntax: `WITH orders(customer, amount) AS (
  VALUES ('Ana', 40), ('Ana', 15),
         ('Ben', 22))
SELECT customer, COUNT(*) AS n
FROM orders
GROUP BY customer;`,
      pitfall: `Returns bigint, so integer division like COUNT(*) / 2 truncates. Cast to numeric first if you need a fraction.` },

    { id: 'functions-ref-02', type: 'concept', tag: 'term',
      term: 'COUNT(col)',
      def: `Returns a bigint: the number of rows in the group where col IS NOT NULL. NULLs are skipped, and an all-NULL or empty group gives 0, never NULL.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `Count how many rides actually received a tip, ignoring rides where tip is NULL.`,
      syntax: `WITH rides(rider, tip) AS (
  VALUES ('Ana', 3.00), ('Ben', NULL),
         ('Ana', 1.50))
SELECT COUNT(*) AS rides,
       COUNT(tip) AS tipped
FROM rides;`,
      pitfall: `COUNT(col) and COUNT(*) differ whenever col has NULLs. Using COUNT(tip) when you meant all rides silently undercounts.` },

    { id: 'functions-ref-03', type: 'concept', tag: 'term',
      term: 'COUNT(DISTINCT col)',
      def: `Returns a bigint: how many different non-NULL values col takes in the group. Duplicates collapse to one and NULLs are ignored.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `Count unique customers who ordered per day, rather than total orders, to measure real reach.`,
      syntax: `WITH orders(customer, ordered_at) AS (
  VALUES ('Ana', date '2025-03-01'),
         ('Ana', date '2025-03-01'),
         ('Ben', date '2025-03-01')
)
SELECT COUNT(DISTINCT customer) AS buyers
FROM orders;`,
      pitfall: `Distinct counts are slow on big tables (sort or hash). Counting on a joined result can also be inflated by fan-out unless you use DISTINCT.` },

    { id: 'functions-ref-04', type: 'concept', tag: 'term',
      term: 'SUM(col)',
      def: `Totals col over non-NULL rows. NULL, not 0, when there are no rows or every value is NULL. smallint/integer input gives bigint, bigint gives numeric; numeric and float keep their type.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `Total revenue per customer from shipped orders, e.g. to rank the biggest accounts.`,
      syntax: `WITH orders(customer, amount) AS (
  VALUES ('Ana', 40), ('Ana', 15),
         ('Ben', NULL)
)
SELECT customer, SUM(amount) AS total
FROM orders
GROUP BY customer;`,
      pitfall: `A group with only NULLs sums to NULL, which breaks later arithmetic. Wrap it: COALESCE(SUM(amount), 0).` },

    { id: 'functions-ref-05', type: 'concept', tag: 'term',
      term: 'AVG(col)',
      def: `Returns the mean of the non-NULL values of col: numeric for integer input, double precision for floats. NULL if no non-NULL values exist.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `Average fare per city to compare markets, or average salary per department.`,
      syntax: `WITH rides(city, fare, tip) AS (
  VALUES ('Austin', 20, 4),
         ('Austin', 10, NULL))
SELECT AVG(tip) AS avg_tip,
       AVG(COALESCE(tip, 0)) AS avg_all
FROM rides;`,
      pitfall: `NULLs are skipped, not counted as zero: the average tip here is 4, not 2. COALESCE inside AVG if NULL really means 0.` },

    { id: 'functions-ref-06', type: 'concept', tag: 'term',
      term: 'MIN(col) / MAX(col)',
      def: `Return the smallest or largest non-NULL value of col, in the column's own type (numbers, dates, text). NULL when the group has no non-NULL values.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `Find each customer's first and latest order date, or the cheapest and priciest product per category.`,
      syntax: `WITH orders(customer, ordered_at) AS (
  VALUES ('Ana', date '2025-01-05'),
         ('Ana', date '2025-03-20'))
SELECT customer, MIN(ordered_at) AS lo,
       MAX(ordered_at) AS hi
FROM orders GROUP BY customer;`,
      pitfall: `They return only the value, not the row it came from. To get the whole latest order row, use ORDER BY ... LIMIT 1 or a window function.` },

    { id: 'functions-ref-07', type: 'concept', tag: 'term',
      term: 'COALESCE(a, b, ...)',
      def: `Returns the first argument that is not NULL, or NULL if all are. Arguments after the first non-NULL one are not evaluated; all must share a compatible type.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, ORDER BY, inside aggregates).`,
      purpose: `Show 0 instead of NULL when a ride has no tip, so totals and displays stay clean.`,
      syntax: `WITH rides(rider, fare, tip) AS (
  VALUES ('Ana', 18.50, 3.00),
         ('Ben', 22.00, NULL))
SELECT rider,
       fare + COALESCE(tip, 0) AS total
FROM rides;`,
      pitfall: `fare + tip is NULL whenever tip is NULL, so Ben's total vanishes without COALESCE. NULL propagates through arithmetic.` },

    { id: 'functions-ref-08', type: 'concept', tag: 'term',
      term: 'NULLIF(a, b)',
      def: `Returns NULL if a equals b, otherwise returns a. Handy for turning a sentinel value such as an empty string back into NULL.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, ORDER BY, inside aggregates).`,
      purpose: `Avoid divide-by-zero in a conversion rate, or turn empty-string cities into real NULLs.`,
      syntax: `WITH stats(song, plays, skips) AS (
  VALUES ('Hey Jude', 0, 0),
         ('Roxanne', 50, 5))
SELECT song,
       skips * 1.0 / NULLIF(plays, 0)
         AS ratio
FROM stats;`,
      pitfall: `Division by NULL gives NULL, which hides the problem instead of erroring. Decide deliberately what an empty denominator should display.` },

    { id: 'functions-ref-09', type: 'concept', tag: 'term',
      term: 'CAST(x AS type) / x::type',
      def: `Converts a value to another type, returning that type. Errors if the value cannot convert (such as 'abc' to integer). NULL casts to NULL. :: is the Postgres shorthand.`,
      runs: `Row-level scalar expression: evaluated per row wherever it appears, including WHERE and JOIN conditions.`,
      purpose: `Turn a text price from an import into numeric, or cast an integer to numeric before dividing.`,
      syntax: `WITH orders(order_id, amount_txt) AS (
  VALUES (1, '40.50'), (2, '15'))
SELECT order_id,
       amount_txt::numeric AS amount,
       CAST(order_id AS text) AS id_txt
FROM orders;`,
      pitfall: `One bad row (like 'N/A') makes the whole query fail with an error, even if it is far from the rows you care about.` },

    { id: 'functions-ref-10', type: 'concept', tag: 'term',
      term: 'ROUND(x, n)',
      def: `Rounds numeric x to n decimal places (n may be negative to round tens, hundreds). Returns numeric; halves round away from zero. For double precision only ROUND(x) exists.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears. Often wraps an aggregate, e.g. ROUND(AVG(fare), 2).`,
      purpose: `Display average fare per city to cents, or round a computed tax to 2 decimals.`,
      syntax: `WITH rides(city, fare) AS (
  VALUES ('Austin', 18.50),
         ('Austin', 9.75),
         ('Austin', 21.10))
SELECT ROUND(AVG(fare), 2) AS avg_fare
FROM rides;`,
      pitfall: `ROUND(double, 2) is an error. Cast to numeric first: ROUND(x::numeric, 2). Integer division also happens before ROUND sees it.` },

    { id: 'functions-ref-11', type: 'concept', tag: 'term',
      term: 'CEIL(x) / FLOOR(x)',
      def: `CEIL returns the smallest integer value not less than x; FLOOR returns the largest not greater than x. Same type as the input (numeric or double). NULL in, NULL out.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, ORDER BY).`,
      purpose: `Work out how many boxes you need for an order (CEIL of items / box size) or bucket fares into whole dollars.`,
      syntax: `WITH orders(order_id, items) AS (
  VALUES (101, 25), (102, 40)
)
SELECT order_id,
       CEIL(items / 12.0) AS boxes
FROM orders;`,
      pitfall: `FLOOR(-2.5) is -3, not -2: it goes toward negative infinity. For rounding toward zero use TRUNC. Integer / integer already truncates first.` },

    { id: 'functions-ref-12', type: 'concept', tag: 'term',
      term: 'ABS(x)',
      def: `Returns the absolute value of x, keeping its numeric type. ABS of NULL is NULL.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, ORDER BY).`,
      purpose: `Measure the size of a price difference regardless of direction, such as refunds recorded as negative amounts.`,
      syntax: `WITH orders(order_id, amount) AS (
  VALUES (1, 40.00), (2, -15.00)
)
SELECT order_id, ABS(amount) AS size
FROM orders
WHERE ABS(amount) > 20;`,
      pitfall: `Using ABS inside WHERE on an indexed column prevents index use. Compare two ranges (amount > 20 OR amount < -20) when it matters.` },

    { id: 'functions-ref-13', type: 'concept', tag: 'term',
      term: 'a % b (modulo)',
      def: `Returns the remainder of a divided by b, with the sign of a (so -7 % 3 is -1). Division by zero raises an error; NULL operands give NULL.`,
      runs: `Row-level operator: evaluated per row wherever it appears, including WHERE and ORDER BY.`,
      purpose: `Split orders into even and odd id groups for A/B tests, or test whether a quantity is a multiple of a box size.`,
      syntax: `WITH orders(order_id, amount) AS (
  VALUES (101, 40), (102, 15), (103, 22)
)
SELECT order_id,
       order_id % 2 = 0 AS in_group_b
FROM orders;`,
      pitfall: `Modulo of a negative number is negative in Postgres, so adjustment % 2 = 1 misses odd negatives. Test adjustment % 2 <> 0 instead.` },

    { id: 'functions-ref-14', type: 'concept', tag: 'term',
      term: 'DATE_TRUNC(unit, ts)',
      def: `Cuts a timestamp down to the start of a unit ('day', 'week', 'month', 'year'...). Returns timestamp or timestamptz; a date input comes back as timestamptz.`,
      runs: `Row-level scalar function: evaluated per row; often repeated in GROUP BY and SELECT. GROUP BY 1 reuses it.`,
      purpose: `Group orders by month to build a monthly revenue report.`,
      syntax: `WITH orders(amount, ordered_at) AS (
  VALUES (40, date '2025-03-04'),
         (15, date '2025-03-28'),
         (22, date '2025-04-02')
)
SELECT DATE_TRUNC('month', ordered_at) AS m,
       SUM(amount) FROM orders GROUP BY 1;`,
      pitfall: `Weeks start on Monday (ISO). The result is a timestamp, not a date, so output shows 00:00:00; cast with ::date for a clean day.` },

    { id: 'functions-ref-15', type: 'concept', tag: 'term',
      term: 'EXTRACT(field FROM ts)',
      def: `Pulls one part (year, month, dow, hour, epoch...) out of a date, timestamp or interval. Returns numeric in PostgreSQL 14 and later (it used to be double precision).`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, GROUP BY, ORDER BY).`,
      purpose: `Find which weekday rides peak, or filter streams to a single year.`,
      syntax: `WITH rides(rider, ride_date) AS (
  VALUES ('Ana', date '2025-03-07'),
         ('Ben', date '2025-03-08'))
SELECT rider,
       EXTRACT(dow FROM ride_date) AS dow
FROM rides;`,
      pitfall: `dow runs 0 (Sunday) to 6, while isodow runs 1 (Monday) to 7. Mixing them up shifts every weekday report by a day.` },

    { id: 'functions-ref-16', type: 'concept', tag: 'term',
      term: 'AGE(a, b)',
      def: `Returns an interval of years, months and days between two timestamps (a minus b). AGE(x) alone measures from today (midnight). NULL in, NULL out.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, ORDER BY).`,
      purpose: `Work out an employee's tenure from hired_on, or how long ago a customer signed up.`,
      syntax: `WITH employees(name, hired_on) AS (
  VALUES ('Maya', date '2021-06-15'))
SELECT name,
       AGE(date '2025-03-01', hired_on)
         AS tenure
FROM employees;`,
      pitfall: `The result is a symbolic interval like '3 years 8 mons', not a number of days. Use EXTRACT(year FROM AGE(...)) or subtract dates for days.` },

    { id: 'functions-ref-17', type: 'concept', tag: 'term',
      term: 'INTERVAL arithmetic',
      def: `date/timestamp +/- interval returns a timestamp; date - date returns an integer number of days; timestamp - timestamp returns an interval. NULL operand gives NULL.`,
      runs: `Row-level operator: evaluated per row wherever it appears, including WHERE and JOIN conditions.`,
      purpose: `Find orders placed in the last 30 days, or compute a delivery due date a week after ordering.`,
      syntax: `WITH orders(order_id, ordered_at) AS (
  VALUES (1, date '2025-03-01')
)
SELECT order_id,
       ordered_at + INTERVAL '7 days' AS due
FROM orders;`,
      pitfall: `date + interval returns a timestamp, not a date, so the output gains 00:00:00. Cast back with ::date. Adding '1 month' to Jan 31 clamps to Feb 28.` },

    { id: 'functions-ref-18', type: 'concept', tag: 'term',
      term: 'CURRENT_DATE / NOW()',
      def: `CURRENT_DATE returns today's date; NOW() returns the current timestamptz. Both are fixed at the start of the transaction, so repeated calls in one transaction return the same value.`,
      runs: `Evaluated once per transaction, not per row; usable anywhere (WHERE, SELECT, DEFAULT).`,
      purpose: `Filter orders from the last 7 days, or stamp new rows with their creation time.`,
      syntax: `SELECT order_id, amount
FROM orders
WHERE ordered_at >= CURRENT_DATE - 7;`,
      noRun: true,
      pitfall: `Inside a transaction NOW() never advances. Use clock_timestamp() if you need the real wall-clock time at each call.` },

    { id: 'functions-ref-19', type: 'concept', tag: 'term',
      term: 'TO_CHAR(value, format)',
      def: `Formats a date, timestamp or number as text using a pattern (YYYY-MM, Mon, 999,999.99). Returns text, so the result sorts alphabetically, not chronologically.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, GROUP BY, ORDER BY).`,
      purpose: `Label a monthly revenue report as 'Mar 2025', or print an order total as '1,234.50'.`,
      syntax: `WITH orders(amount, ordered_at) AS (
  VALUES (1234.5, date '2025-03-04'))
SELECT
  TO_CHAR(ordered_at, 'Mon YYYY') AS month,
  TO_CHAR(amount, 'FM999,999.00') AS shown
FROM orders;`,
      pitfall: `Sorting by TO_CHAR(date, 'Mon YYYY') puts Apr before Mar. Order by DATE_TRUNC (a real date) and only format for display.` },

    { id: 'functions-ref-20', type: 'concept', tag: 'term',
      term: 'a || b  vs  CONCAT(a, b)',
      def: `Both join text. The || operator returns NULL if any operand is NULL; CONCAT treats NULL as an empty string and always returns text. CONCAT_WS adds a separator.`,
      runs: `Row-level scalar: evaluated per row wherever it appears (SELECT, WHERE, ORDER BY, JOIN conditions).`,
      purpose: `Build a display name from first, middle and last name parts when some parts may be missing.`,
      syntax: `WITH customers(first_name, last_name) AS (
  VALUES ('Ana', 'Ruiz'), ('Ben', NULL))
SELECT first_name || ' ' || last_name AS a,
       CONCAT(first_name, ' ',
              last_name) AS b
FROM customers;`,
      pitfall: `With || the NULL last name makes Ben's whole name NULL. CONCAT keeps 'Ben ' (with a trailing space) instead.` },

    { id: 'functions-ref-21', type: 'concept', tag: 'term',
      term: 'SPLIT_PART(text, delim, n)',
      def: `Returns the nth piece (counting from 1) of text split on delim, as text. Returns an empty string, not NULL, if n is past the last piece. NULL input gives NULL.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, GROUP BY).`,
      purpose: `Get the domain from an email address ('ana@shop.com' gives 'shop.com') to count customers per company.`,
      syntax: `WITH customers(name, email) AS (
  VALUES ('Ana', 'ana@shop.com'),
         ('Ben', 'ben@mail.org'))
SELECT name,
       SPLIT_PART(email, '@', 2) AS domain
FROM customers;`,
      pitfall: `Indexes start at 1 (0 is an error). A missing piece yields '' rather than NULL, so COALESCE will not catch it; use NULLIF(..., '').` },

    { id: 'functions-ref-22', type: 'concept', tag: 'term',
      term: 'SUBSTRING(text FROM start FOR len)',
      def: `Returns part of a string starting at position start (1-based) for len characters, as text. Omit FOR to go to the end. Also accepts a POSIX regex: SUBSTRING(s FROM 'pattern').`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, GROUP BY).`,
      purpose: `Take the first 3 characters of a SKU as the category code, or the first letter of a name.`,
      syntax: `WITH products(sku, name) AS (
  VALUES ('ELC-1042', 'Headphones'),
         ('HOM-2210', 'Lamp'))
SELECT sku,
       SUBSTRING(sku FROM 1 FOR 3) AS cat
FROM products;`,
      pitfall: `Positions start at 1, not 0. SUBSTRING(sku, 0, 3) returns only 2 characters, a classic off-by-one.` },

    { id: 'functions-ref-23', type: 'concept', tag: 'term',
      term: 'TRIM(text)',
      def: `Removes leading and trailing spaces (or the characters you name) and returns text. Variants: LTRIM, RTRIM, TRIM(BOTH/LEADING/TRAILING 'x' FROM s). NULL in, NULL out.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, JOIN conditions).`,
      purpose: `Clean customer names from a messy CSV import so '  Ana ' joins and groups with 'Ana'.`,
      syntax: `WITH customers(name, city) AS (
  VALUES ('  Ana ', 'Austin'),
         ('Ben', 'Boston'))
SELECT TRIM(name) AS clean,
       LENGTH(name) AS raw_len
FROM customers;`,
      pitfall: `Only edges are trimmed, not inner spaces, and by default only the space character (not tabs or newlines). Use REGEXP_REPLACE for those.` },

    { id: 'functions-ref-24', type: 'concept', tag: 'term',
      term: 'UPPER(text) / LOWER(text)',
      def: `Return the text converted to upper or lower case, as text. NULL in, NULL out. Behaviour on non-ASCII letters depends on the database locale.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, JOIN, ORDER BY).`,
      purpose: `Match emails case-insensitively, since 'Ana@Shop.com' and 'ana@shop.com' are the same customer.`,
      syntax: `WITH customers(name, email) AS (
  VALUES ('Ana', 'Ana@Shop.com')
)
SELECT name
FROM customers
WHERE LOWER(email) = 'ana@shop.com';`,
      pitfall: `Wrapping a column in LOWER() blocks a plain index on it. Create an index on LOWER(email), or use the citext type.` },

    { id: 'functions-ref-25', type: 'concept', tag: 'term',
      term: 'REPLACE(text, from, to)',
      def: `Replaces every occurrence of the literal substring from with to and returns text. Case-sensitive, no patterns. NULL in any argument gives NULL.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, JOIN).`,
      purpose: `Strip dashes from phone numbers or swap 'Street' for 'St' in addresses before comparing.`,
      syntax: `WITH customers(name, phone) AS (
  VALUES ('Ana', '512-555-0142'))
SELECT name,
       REPLACE(phone, '-', '') AS digits
FROM customers;`,
      pitfall: `Treats every argument literally: REPLACE(s, '.', '') removes dots, not "any character". For patterns, use REGEXP_REPLACE.` },

    { id: 'functions-ref-26', type: 'concept', tag: 'term',
      term: 'REGEXP_REPLACE(s, pattern, repl, flags)',
      def: `Replaces the first match of a POSIX regex with repl (backrefs like \\1 allowed) and returns text. Add flag 'g' to replace all matches, 'i' for case-insensitive.`,
      runs: `Row-level scalar function: evaluated per row wherever it appears (SELECT, WHERE, JOIN).`,
      purpose: `Keep only digits from a messy phone column so formats like '(512) 555-0142' all match.`,
      syntax: `WITH customers(name, phone) AS (
  VALUES ('Ana', '(512) 555-0142'))
SELECT name,
       REGEXP_REPLACE(phone, '\\D', '',
                      'g') AS digits
FROM customers;`,
      pitfall: `Without the 'g' flag only the first match changes, so '(512) 555' keeps most of its junk. Forgetting 'g' is the usual bug.` },

    { id: 'functions-ref-27', type: 'concept', tag: 'term',
      term: 'STRING_AGG(expr, sep)',
      def: `Aggregate that joins the non-NULL text values of a group into one string separated by sep. Returns NULL for an empty group. Add ORDER BY inside to control the order.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `List every song in a playlist or all employee names per department on one line.`,
      syntax: `WITH employees(name, dept) AS (
  VALUES ('Maya', 'Sales'),
         ('Leo', 'Sales'),
         ('Zoe', 'Ops'))
SELECT dept,
       STRING_AGG(name, ', ' ORDER BY name)
FROM employees GROUP BY dept;`,
      pitfall: `Without ORDER BY inside the call, the order of the joined values is not guaranteed and can change between runs.` },

    { id: 'functions-ref-28', type: 'concept', tag: 'term',
      term: 'ARRAY_AGG(expr)',
      def: `Aggregate that collects values of a group into an array of the input type, in no guaranteed order unless you add ORDER BY. Unlike most aggregates it keeps NULLs; empty group gives NULL.`,
      runs: `Aggregate: computed at GROUP BY (after WHERE); visible in HAVING, SELECT and ORDER BY, never in WHERE.`,
      purpose: `Gather each customer's order ids into one array column for a compact report or an API response.`,
      syntax: `WITH orders(customer, order_id) AS (
  VALUES ('Ana', 101), ('Ana', 107),
         ('Ben', 102))
SELECT customer,
       ARRAY_AGG(order_id ORDER BY order_id)
FROM orders GROUP BY customer;`,
      pitfall: `NULL inputs become NULL elements of the array, which surprises later code. Filter them: ARRAY_AGG(id) FILTER (WHERE id IS NOT NULL).` },

    { id: 'functions-ref-29', type: 'concept', tag: 'term',
      term: 'ROW_NUMBER() OVER (...)',
      def: `Window function returning a bigint: 1, 2, 3... for each row in its partition, in the window's ORDER BY. Never ties; equal rows get arbitrary but distinct numbers.`,
      runs: `5th, during SELECT: after WHERE, GROUP BY and HAVING; before DISTINCT and ORDER BY. Not allowed in WHERE.`,
      purpose: `Pick the latest order per customer, or number rides per rider to deduplicate.`,
      syntax: `WITH orders(customer, amount, ordered_at)
AS (VALUES ('Ana', 40, date '2025-03-01'),
           ('Ana', 15, date '2025-03-09'))
SELECT customer, amount,
  ROW_NUMBER() OVER (
    PARTITION BY customer
    ORDER BY ordered_at DESC) AS rn
FROM orders;`,
      pitfall: `You cannot filter WHERE rn = 1 in the same query. Wrap it in a subquery or CTE first. A non-unique ORDER BY makes the picked row non-deterministic.` },

    { id: 'functions-ref-30', type: 'concept', tag: 'term',
      term: 'RANK() OVER (...)',
      def: `Window function returning a bigint rank within the partition. Tied rows share a rank and the next rank skips ahead (1, 1, 3). Without ORDER BY every row ties at 1.`,
      runs: `5th, during SELECT: after WHERE, GROUP BY and HAVING; before DISTINCT and ORDER BY. Not allowed in WHERE.`,
      purpose: `Rank employees by salary within each department, allowing ties at the top.`,
      syntax: `WITH employees(name, dept, salary) AS (
  VALUES ('Maya', 'Sales', 90),
         ('Leo', 'Sales', 90),
         ('Sam', 'Sales', 70))
SELECT name, RANK() OVER (
  PARTITION BY dept
  ORDER BY salary DESC) AS r
FROM employees;`,
      pitfall: `After a tie the numbers have gaps (1, 1, 3), so 'rank = 2' may return nothing. Use DENSE_RANK if you need consecutive ranks.` },

    { id: 'functions-ref-31', type: 'concept', tag: 'term',
      term: 'DENSE_RANK() OVER (...)',
      def: `Window function returning a bigint rank where ties share a rank and the next rank is consecutive, with no gaps (1, 1, 2). Without ORDER BY every row ties at 1.`,
      runs: `5th, during SELECT: after WHERE, GROUP BY and HAVING; before DISTINCT and ORDER BY. Not allowed in WHERE.`,
      purpose: `Find the second-highest salary in each department: the second distinct salary level, however many people tie.`,
      syntax: `WITH employees(name, dept, salary) AS (
  VALUES ('Maya', 'Sales', 90),
         ('Leo', 'Sales', 90),
         ('Sam', 'Sales', 70))
SELECT name, DENSE_RANK() OVER (
  PARTITION BY dept
  ORDER BY salary DESC) AS d
FROM employees;`,
      pitfall: `It ranks distinct values, not rows, so top-N by DENSE_RANK can return more than N rows when ties occur.` },

    { id: 'functions-ref-32', type: 'concept', tag: 'term',
      term: 'NTILE(n) OVER (...)',
      def: `Window function that splits the ordered partition into n buckets numbered 1..n and returns each row's bucket as an integer. Bucket sizes differ by at most one row.`,
      runs: `5th, during SELECT: after WHERE, GROUP BY and HAVING; before DISTINCT and ORDER BY. Not allowed in WHERE.`,
      purpose: `Tag customers by total spend into quartiles (NTILE(4)) to find the top 25% for a loyalty offer.`,
      syntax: `WITH customers(name, spend) AS (
  VALUES ('Ana', 900), ('Ben', 400),
         ('Cy', 250), ('Di', 100))
SELECT name,
       NTILE(2) OVER (
         ORDER BY spend DESC) AS half
FROM customers;`,
      pitfall: `Buckets are by row count, not by value: tied spends can land in different buckets, and with 5 rows in 2 buckets the first gets 3.` },

    { id: 'functions-ref-33', type: 'concept', tag: 'term',
      term: 'LAG() / LEAD() OVER (...)',
      def: `Window functions returning the value from the previous (LAG) or next (LEAD) row in the window order, in the column's type. Optional offset and default: LAG(x, 1, 0). NULL if no such row.`,
      runs: `5th, during SELECT: after WHERE, GROUP BY and HAVING; before DISTINCT and ORDER BY. Not allowed in WHERE.`,
      purpose: `Compare each month's revenue to the previous month, or see the time since a user's last login.`,
      syntax: `WITH logins(user_name, login_date) AS (
  VALUES ('ana', date '2025-03-01'),
         ('ana', date '2025-03-05'))
SELECT login_date,
       login_date - LAG(login_date)
         OVER (ORDER BY login_date) AS gap
FROM logins;`,
      pitfall: `The first row has no previous row, so LAG gives NULL unless you pass a default. Also add PARTITION BY or one user's row leaks into another's.` },

    { id: 'functions-ref-34', type: 'concept', tag: 'term',
      term: 'FIRST_VALUE(expr) OVER (...)',
      def: `Window function returning expr from the first row of the window frame, in expr's type. The default frame ends at the current row, so it is the first row of the partition in order.`,
      runs: `5th, during SELECT: after WHERE, GROUP BY and HAVING; before DISTINCT and ORDER BY. Not allowed in WHERE.`,
      purpose: `Show each rider's very first fare alongside every later ride, or each employee next to the top earner in their dept.`,
      syntax: `WITH rides(rider, fare, ride_date) AS (

      why: `Single quotes make a string literal, not a name. Use double quotes: AS "Unit Price". Spaces are allowed in a double-quoted alias, and AS is optional but legal.` },

    { id: 'select-filter-37', type: 'mcq', tag: 'syntax',
      q: `Which of these is NOT valid PostgreSQL for an inequality test?`,
      options: [`price <> 5`, `price != 5`, `price ^= 5`, `price IS DISTINCT FROM 5`],
      answer: 2,
      why: `<> is standard and PostgreSQL also accepts != as a synonym. ^= is Oracle-only. IS DISTINCT FROM is valid and also treats NULL as a comparable value.` },

    { id: 'select-filter-38', type: 'mcq', tag: 'syntax',
      q: `Which condition keeps customers whose name starts with A or B, in one test?`,

      answer: 0,
      why: `LIKE ANY compares against every pattern in an array and passes if any matches. OR needs a full condition on each side, and neither LIKE (... OR ...) nor LIKE IN is valid syntax.` },

    { id: 'select-filter-39', type: 'mcq', tag: 'debug',
      q: `This fails with: column "name" does not exist. What is missing?`,
      code: `SELECT name
WHERE city = 'Oslo';`,
      noRun: true,
      options: [`A GROUP BY clause on city`, `Parentheses around the WHERE condition`, `A comma between name and WHERE`, `A FROM clause that names the table`],
      answer: 3,
      why: `Without FROM there is no table, so name and city refer to nothing. SELECT without FROM works only for constants and expressions such as SELECT 1.` },

    { id: 'select-filter-r01', type: 'recall', tag: 'theory',
      front: `Rank NOT, AND and OR from highest to lowest precedence.`,
      back: `NOT first, then AND, then OR. So <code>a OR b AND c</code> means <code>a OR (b AND c)</code>. Add parentheses whenever you mix AND and OR.` },

    { id: 'select-filter-r02', type: 'recall', tag: 'syntax',
      front: `What does price BETWEEN 20 AND 8 return, and what is the fix?`,

      back: `Yes, any column of the FROM tables works. The exception is SELECT DISTINCT, where ORDER BY expressions must appear in the select list.` },

    { id: 'select-filter-r04', type: 'recall', tag: 'syntax',
      front: `Must a LIKE pattern match the whole string or only part of it?`,
      back: `The whole string. <code>'Ana' LIKE 'An'</code> is false; use <code>'An%'</code> to match a prefix. (The regex operator <code>~</code> matches anywhere.)` },

    { id: 'select-filter-r05', type: 'recall', tag: 'interview',
      front: `In PostgreSQL, what do single quotes make, and what do double quotes make?`,
      back: `Single quotes make string literals (<code>'Ada'</code>); double quotes make identifiers (<code>"Total"</code>).` }

  id: 'aggregation',
  name: 'Aggregation & GROUP BY',

      options: [`2`, `3`, `1`, `NULL`],

    { id: 'aggregation-02', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `WITH rides(rider, tip) AS (VALUES
  ('Ana', 3.00), ('Ben', NULL),
  ('Cy', 3.00), ('Di', 5.00))
SELECT count(DISTINCT tip) FROM rides;`,
      options: [`2`, `3`, `4`, `1`],
      answer: 0,
      why: `DISTINCT removes the duplicate 3.00, and count ignores NULL, leaving {3.00, 5.00}. 3 is tempting if you treat NULL as one more distinct value, but aggregates skip NULLs.` },
    { id: 'aggregation-03', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `WITH rides(rider, fare) AS (VALUES

SELECT round(avg(DISTINCT fare))
FROM rides;`,

    { id: 'aggregation-04', type: 'mcq', tag: 'postgres',
      q: `In PostgreSQL, what type does avg() return when its input is an integer column?`,

    { id: 'aggregation-05', type: 'mcq', tag: 'output',

    { id: 'postgres-15', type: 'mcq', tag: 'postgres',
      q: `INSERT ... ON CONFLICT DO NOTHING RETURNING id hits an existing row. What does RETURNING give?`,

    { id: 'postgres-16', type: 'mcq', tag: 'syntax',

    { id: 'postgres-17', type: 'mcq', tag: 'interview',
      q: `An INSERT that used a SERIAL id is rolled back. What happens to that id?`,

    { id: 'postgres-18', type: 'mcq', tag: 'output',

    { id: 'postgres-20', type: 'mcq', tag: 'output',
