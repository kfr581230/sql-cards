<body>
<main id="app"></main>
<p class="offline-note">SQL Cards · version 202610290001 · <span id="net-status"></span></p>
<div id="update-bar" class="update-bar" hidden><span>Update ready.</span><button type="button" id="update-btn">Refresh</button></div>
<script>
(function () {
var highlight = (function () {
// Tiny SQL highlighter + a textarea-over-pre editor. No dependencies.
const KEYWORDS = new Set(`
select from where and or not in is null like ilike between as on join inner left right full outer cross natural using
group by order having limit offset distinct all any some exists case when then else end union intersect except with recursive
insert into values update set delete create table view index drop alter add column primary key foreign references default
unique check constraint asc desc nulls first last over partition rows range unbounded preceding following current row
filter within lateral returning true false interval date time timestamp timestamptz numeric integer int bigint text varchar
boolean real double precision cast explain analyze begin commit rollback similar to escape fetch next only ties window
grouping sets rollup cube materialized if replace temp temporary jsonb json array zone at serial smallint char
`.trim().split(/\s+/));

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const TOKEN = /(--[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:[^']|'')*'?)|("(?:[^"]|"")*"?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)(\s*\()?|(::|<>|!=|<=|>=|\|\||->>?|#>>?|[=<>+\-*/%])|(\s+)|(.)/g;

function highlight(sql) {
  let out = '';
  sql.replace(TOKEN, (m, comment, str, ident, num, word, paren, op, ws, other) => {
    if (comment) out += `<span class="t-c">${esc(comment)}</span>`;
    else if (str) out += `<span class="t-s">${esc(str)}</span>`;
    else if (ident) out += `<span class="t-i">${esc(ident)}</span>`;
    else if (num) out += `<span class="t-n">${num}</span>`;
    else if (word) {
      const lw = word.toLowerCase();
      if (paren) out += `<span class="t-f">${esc(word)}</span>${esc(paren)}`;
      else if (KEYWORDS.has(lw)) out += `<span class="t-k">${esc(word)}</span>`;
      else out += esc(word);
    }
    else if (op) out += `<span class="t-o">${esc(op)}</span>`;
    else out += esc(ws || other || '');
    return m;
  });
  return out;
}


return highlight;
})();
// Spaced-repetition review: Anki-style scheduling (learning steps, ease factor, lapses)
// plus a phone-first study UI. No imports and no network use, so this same file is
// inlined into the standalone offline build.

const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
const LEARN_STEPS = [1 * MIN, 10 * MIN];
const RELEARN_STEPS = [10 * MIN];
const GRADUATE_DAYS = 1, EASY_DAYS = 4, MAX_DAYS = 3650;
const START_EASE = 2.5, MIN_EASE = 1.3;
const LEARN_AHEAD = 20 * MIN;
const ROLLOVER_HOUR = 4; // a review "day" starts at 4am, like Anki

const GRADES = [
  { g: 1, key: 'again', label: 'Again' },
  { g: 2, key: 'hard', label: 'Hard' },
  { g: 3, key: 'good', label: 'Good' },
  { g: 4, key: 'easy', label: 'Easy' }
];

/* ---------- time helpers ---------- */
function dayStart(t) {
  const d = new Date(t - ROLLOVER_HOUR * HOUR);
  d.setHours(0, 0, 0, 0);
  return d.getTime() + ROLLOVER_HOUR * HOUR;
}
function dayKey(t) {
  const d = new Date(dayStart(t));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtIvl(ms) {
  if (ms < HOUR) return `${Math.max(1, Math.round(ms / MIN))}m`;
  if (ms < DAY) return `${Math.round(ms / HOUR)}h`;
  const d = ms / DAY;
  if (d < 30) return `${Math.round(d)}d`;
  if (d < 365) return `${(d / 30).toFixed(d < 300 ? 1 : 0).replace(/\.0$/, '')}mo`;
  return `${(d / 365).toFixed(1).replace(/\.0$/, '')}y`;
}

/* ---------- scheduler ---------- */
function graduate(c, days, now) {
  c.q = 'review'; c.step = 0;
  c.ivl = Math.min(MAX_DAYS, Math.max(1, Math.round(days)));
  c.due = dayStart(now) + c.ivl * DAY;
}

// Returns a new card state after grading g (1 again, 2 hard, 3 good, 4 easy).
function schedule(card, g, now = Date.now()) {
  const c = { q: 'new', ivl: 0, ease: START_EASE, step: 0, reps: 0, lapses: 0, due: 0, ...card };
  c.reps++;
  if (c.q === 'new') { c.q = 'learn'; c.step = 0; c.ease = START_EASE; }
  if (c.q === 'learn' || c.q === 'relearn') {
    const steps = c.q === 'relearn' ? RELEARN_STEPS : LEARN_STEPS;
    const step = Math.min(c.step, steps.length - 1);
    if (g === 1) { c.step = 0; c.due = now + steps[0]; }
    else if (g === 2) { c.step = step; c.due = now + (step === 0 && steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps[step] * 1.5); }
    else if (g === 3) {
      if (step + 1 < steps.length) { c.step = step + 1; c.due = now + steps[c.step]; }
      else graduate(c, c.q === 'relearn' ? Math.max(1, c.ivl) : GRADUATE_DAYS, now);
    } else graduate(c, c.q === 'relearn' ? Math.max(1, c.ivl) + 1 : EASY_DAYS, now);
    return c;
  }
  // review card
  const late = Math.max(0, (dayStart(now) - c.due) / DAY);
  if (g === 1) {
    c.lapses++;
    c.ease = Math.max(MIN_EASE, c.ease - 0.2);
    c.ivl = Math.max(1, Math.round(c.ivl * 0.2));
    c.q = 'relearn'; c.step = 0; c.due = now + RELEARN_STEPS[0];
    return c;
  }
  const hard = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2));
  const good = Math.max(hard + 1, Math.round((c.ivl + late / 2) * c.ease));
  const easy = Math.max(good + 1, Math.round((c.ivl + late) * c.ease * 1.3));
  if (g === 2) c.ease = Math.max(MIN_EASE, c.ease - 0.15);
  if (g === 4) c.ease += 0.15;
  graduate(c, g === 2 ? hard : g === 3 ? good : easy, now);
  return c;
}

function previewMs(card, g, now) {
  const next = schedule(card, g, now);
  return next.q === 'review' ? next.ivl * DAY : next.due - now;
}

/* ---------- persistence (per-viewer; falls back to memory) ---------- */
function createStore(key) {
  let mem = null;
  const blank = () => ({ v: 1, cards: {}, days: {}, settings: { newPerDay: 15 } });
  const load = () => {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(key)) || blank(); } catch { mem = blank(); }
    mem.cards = mem.cards || {}; mem.days = mem.days || {}; mem.settings = { newPerDay: 15, ...(mem.settings || {}) };
    return mem;
  };
  const save = () => { try { localStorage.setItem(key, JSON.stringify(mem)); } catch {} };
  return {
    get data() { return load(); },
    save,
    reset() { const settings = load().settings; mem = blank(); mem.settings = settings; save(); },
    exportCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(load())))); },
    importCode(code) {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      if (!parsed || typeof parsed.cards !== 'object') throw new Error('Not a QueryPath backup');
      mem = { ...blank(), ...parsed }; save();
    }
  };
}

/* ---------- UI ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const TAG_LABEL = { term: 'Study card', syntax: 'Syntax', theory: 'Theory', output: 'Predict the output', debug: 'Spot the bug', order: 'Execution order', interview: 'Interview', postgres: 'PostgreSQL' };

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function mountReview(root, decks, { storageKey = 'qp.srs.v1', highlight = esc, onSessionChange } = {}) {
  const store = createStore(storageKey);
  // Round-robin across decks, so "All decks" introduces new cards from every topic, not deck 1 first.
  const allCards = [];
  const deckOf = {};
  for (const d of decks) for (const c of d.cards) deckOf[c.id] = d;
  for (let i = 0, more = true; more; i++) {
    more = false;
    for (const d of decks) if (i < d.cards.length) { allCards.push(d.cards[i]); more = true; }
  }
  const state = id => store.data.cards[id] || { q: 'new' };
  let canSave = true;
  try { localStorage.setItem('qp.srs.probe', '1'); canSave = localStorage.getItem('qp.srs.probe') === '1'; localStorage.removeItem('qp.srs.probe'); } catch { canSave = false; }

  function today() {
    const k = dayKey(Date.now());
    const d = store.data.days;
    return (d[k] = d[k] || { reviews: 0, correct: 0, newSeen: 0 });
  }
  function streak() {
    const days = store.data.days;
    let n = 0, t = Date.now();
    if (!(days[dayKey(t)] && days[dayKey(t)].reviews)) t -= DAY; // today not done yet: count from yesterday
    while (days[dayKey(t)] && days[dayKey(t)].reviews) { n++; t -= DAY; }
    return n;
  }
  function counts(cards, now = Date.now()) {
    const end = dayStart(now) + DAY;
    let fresh = 0, learn = 0, due = 0;
    for (const c of cards) {
      const s = state(c.id);
      if (s.q === 'new') fresh++;
      else if (s.q === 'learn' || s.q === 'relearn') { if (s.due <= now + LEARN_AHEAD) learn++; }
      else if (s.due < end) due++;
    }
    return { fresh: Math.min(fresh, newLeft()), freshTotal: fresh, learn, due };
  }
  // The daily new-card limit is shared by all decks (like Anki's parent-deck limit).
  function newLeft() { return Math.max(0, store.data.settings.newPerDay + (today().extraNew || 0) - today().newSeen); }

  // Next card: learning cards that are due, then reviews due today, then new cards (daily cap).
  function nextCard(cards, now = Date.now()) {
    let bestLearn = null, bestReview = null, firstNew = null, firstNewStudy = null, firstNewOther = null;
    const end = dayStart(now) + DAY;
    for (const c of cards) {
      const s = state(c.id);
      if (s.q === 'learn' || s.q === 'relearn') { if (s.due <= now && (!bestLearn || s.due < state(bestLearn.id).due)) bestLearn = c; }
      else if (s.q === 'review') { if (s.due < end && (!bestReview || s.due < state(bestReview.id).due)) bestReview = c; }
      else if (c.type === 'concept') { if (!firstNewStudy) firstNewStudy = c; }
      else if (!firstNewOther) firstNewOther = c;
    }
    // new cards alternate: a study card, then a question card, so neither kind gets starved by the daily cap
    firstNew = (today().newSeen % 2 === 0 ? firstNewStudy || firstNewOther : firstNewOther || firstNewStudy);
    if (bestLearn) return bestLearn;
    if (bestReview) return bestReview;
    if (firstNew && newLeft() > 0) return firstNew;
    // nothing else left: allow learning cards due within the learn-ahead window
    let ahead = null;
    for (const c of cards) {
      const s = state(c.id);
      if ((s.q === 'learn' || s.q === 'relearn') && s.due <= now + LEARN_AHEAD && (!ahead || s.due < state(ahead.id).due)) ahead = c;
    }
    return ahead;
  }
  function nextDueAt(cards) {
    let t = Infinity;
    for (const c of cards) { const s = state(c.id); if (s.q !== 'new' && s.due < t) t = s.due; }
    return t;
  }

  /* ----- home ----- */
  function renderHome() {
    closeSession();
    const all = counts(allCards);
    const t = today();
    const acc = t.reviews ? Math.round(t.correct / t.reviews * 100) : null;
    const learned = allCards.filter(c => state(c.id).q !== 'new').length;
    const mature = allCards.filter(c => state(c.id).ivl >= 21).length;
    const totalDue = all.fresh + all.learn + all.due;
    root.innerHTML = `
      <div class="fc-home">
        <section class="fc-hero">
          <div class="fc-hero-top"><div class="fc-kicker">Daily review · works offline</div><button type="button" class="fc-gear" data-act="settings" aria-label="Settings and backup">⚙︎ Settings</button></div>
          <h1>Review</h1>
          ${learned ? '' : `<p class="fc-lead">${allCards.length} cards across ${decks.length} decks. Clear today's reviews first, then learn a few new cards. Five minutes a day beats an hour on Sunday.</p>`}
          ${canSave ? '' : `<p class="fc-warn">This viewer can't save progress between visits. Use Settings → Copy code before you close it.</p>`}
          <div class="fc-stats">
            <div><b>${streak()}</b><span>day streak</span></div>
            <div><b>${t.reviews}</b><span>reviews today</span></div>
            <div><b>${acc === null ? '–' : acc + '%'}</b><span>pass rate today</span></div>
            <div><b>${learned}</b><span>cards started</span></div>
          </div>
          <button type="button" class="fc-btn fc-primary fc-study" data-act="study" ${totalDue ? '' : 'disabled'}>
            ${totalDue ? `Study now <span class="fc-counts">${countPills(all)}</span>` : 'All caught up for today ✓'}
          </button>
          ${totalDue ? '' : `<p class="fc-sub">${nextDueText(allCards)}</p><div class="fc-row fc-more"><button type="button" class="fc-btn fc-ghost" data-act="more-new">Learn 10 more</button><button type="button" class="fc-btn fc-ghost" data-act="quiz">Quick quiz</button></div>`}
        </section>

        <section class="fc-decks" aria-label="Decks">
          <div class="fc-section-h"><h2>Decks</h2><span class="fc-legend"><span class="fc-n fc-new">New</span><span class="fc-n fc-learn">Learning</span><span class="fc-n fc-due">Due</span></span></div>
          <p class="fc-sub fc-limit-note">${newLeft()} of ${store.data.settings.newPerDay + (t.extraNew || 0)} new cards left today, shared across decks.</p>
          <ul>${decks.map((d, i) => {
            const studyOnly = x => x && x.cards.every(c => c.type === 'concept');
            const head = i === 0 && studyOnly(d) ? '<li class="fc-subhead">Study cards · flip and recall</li>' : (!studyOnly(d) && (i === 0 || studyOnly(decks[i - 1])) ? '<li class="fc-subhead">Practice decks · questions</li>' : '');
            const k = counts(d.cards);
            const started = d.cards.filter(c => state(c.id).q !== 'new').length;
            const pct = Math.round(started / d.cards.length * 100);
            const idle = !(k.fresh + k.learn + k.due);
            return `${head}<li class="fc-deck${idle ? ' is-idle' : ''}">
              <button type="button" class="fc-deck-main" data-act="study" data-deck="${d.id}">
                <span class="fc-deck-emoji" aria-hidden="true">${d.emoji}</span>
                <span class="fc-deck-text"><span class="fc-deck-name">${esc(d.name)}</span><span class="fc-deck-blurb">${esc(d.blurb)}</span>
                  <span class="fc-bar" aria-label="${pct}% started"><span style="width:${pct}%"></span></span></span>
                ${idle ? '<span class="fc-idle">✓ Done</span>' : `<span class="fc-counts">${countPills(k)}</span>`}
              </button>
              <span class="fc-side-btns">${d.cards.some(c => c.type === 'mcq') ? `<button type="button" class="fc-quiz-btn" data-act="quiz" data-deck="${d.id}" aria-label="Quiz: ${esc(d.name)}">Quiz</button>` : ''}<button type="button" class="fc-quiz-btn" data-act="browse" data-deck="${d.id}" aria-label="Browse: ${esc(d.name)}">Browse</button></span>
            </li>`;
          }).join('')}</ul>
          <button type="button" class="fc-btn fc-ghost fc-quiz-all" data-act="quiz">Mixed quiz · 15 random questions</button>
        </section>

        <details class="fc-panel">
          <summary>How to review like a warrior</summary>
          <ol class="fc-rules">
            <li><strong>Never skip a day.</strong> Reviews pile up fast. Five minutes on the train beats an hour on Sunday.</li>
            <li><strong>Reviews before new cards.</strong> Study now always clears what's due first, then adds new cards.</li>
            <li><strong>Grade honestly.</strong> A wrong answer always counts as Again. Got it right but slowly? Hard. Right with a little thought? Good. Instant? Easy.</li>
            <li><strong>Keep new cards small.</strong> 10 to 20 a day keeps daily reviews under 15 minutes. Raise it only when reviews feel light.</li>
            <li><strong>Read the explanation on every miss.</strong> The "why" is the lesson. Then move on; the card comes back in minutes.</li>
          </ol>
          <p class="fc-sub">Intervals grow each time you remember: 1 minute → 10 minutes → 1 day → 3 days → a week and beyond. Forgotten cards drop back into short steps.</p>
        </details>

        <details class="fc-panel" id="fc-settings">
          <summary>Settings & backup</summary>
          <div class="fc-setting">
            <span>New cards per day <small>(all decks)</small></span>
            <span class="fc-stepper"><button type="button" data-act="new-minus" aria-label="Fewer new cards">−</button><b data-new-limit>${store.data.settings.newPerDay}</b><button type="button" data-act="new-plus" aria-label="More new cards">+</button></span>
          </div>
          <p class="fc-sub">Progress is saved on this device only. ${learned} started · ${mature} mature (21+ day interval). To move progress to another device or the offline copy, copy a backup code here and restore it there.</p>
          <div class="fc-row"><button type="button" class="fc-btn fc-ghost" data-act="backup">Copy code</button><button type="button" class="fc-btn fc-ghost" data-act="restore-open">Restore</button></div>
          <div class="fc-msg" aria-live="polite"></div>
          <div class="fc-restore" hidden>
            <textarea id="fc-restore-input" rows="3" placeholder="Paste a backup code" aria-label="Backup code"></textarea>
            <button type="button" class="fc-btn fc-primary" data-act="restore">Restore progress</button>
          </div>
          <button type="button" class="fc-link-danger" data-act="reset">Reset all review progress</button>
        </details>
      </div>`;
  }

  function countPills(k, labels) {
    return `<span class="fc-n fc-new" title="New">${k.fresh}</span><span class="fc-n fc-learn" title="Learning">${k.learn}</span><span class="fc-n fc-due" title="Due">${k.due}</span>`;
  }
  function nextDueText(cards) {
    const t = nextDueAt(cards);
    if (!isFinite(t)) return 'No reviews scheduled yet.';
    const ms = t - Date.now();
    return ms <= 0 ? 'More cards are ready.' : `Next review in ${fmtIvl(ms)}.`;
  }

  /* ----- session overlay ----- */
  let session = null;
  function openOverlay() {
    let ov = document.querySelector('.fc-session');
    if (!ov) {
      ov = document.createElement('div');
      ov.className = 'fc-session';
      ov.setAttribute('role', 'dialog');
      ov.setAttribute('aria-modal', 'true');
      document.body.appendChild(ov);
    }
    document.documentElement.classList.add('fc-locked');
    // a history entry, so an iOS back-swipe ends the session instead of leaving the page
    if (!(history.state && history.state.fcSession)) { try { history.pushState({ fcSession: true }, ''); } catch {} }
    onSessionChange && onSessionChange(true);
    return ov;
  }
  function exitSession() {
    if (history.state && history.state.fcSession) history.back(); // popstate renders home
    else renderHome();
  }
  function closeSession() {
    session = null;
    const ov = document.querySelector('.fc-session');
    if (ov) ov.remove();
    document.documentElement.classList.remove('fc-locked');
    onSessionChange && onSessionChange(false);
  }

  function shell(ov, { title, right = '', progress = 0 }) {
    ov.innerHTML = `
      <div class="fc-top">
        <button type="button" class="fc-x" data-act="exit" aria-label="End session">✕</button>
        <div class="fc-top-title">${esc(title)}</div>
        <div class="fc-top-right">${right}</div>
      </div>
      <div class="fc-progress"><span style="width:${Math.round(progress * 100)}%"></span></div>
      <div class="fc-scroll"><article class="fc-card"></article></div>
      <div class="fc-actions"></div>`;
    return { card: ov.querySelector('.fc-card'), actions: ov.querySelector('.fc-actions'), scroll: ov.querySelector('.fc-scroll') };
  }

  const QUEUE_LABEL = { new: 'New', learn: 'Learning', relearn: 'Relearning', review: 'Review' };
  function cardBody(c, order, queue) {
    const tag = `<div class="fc-meta"><span class="fc-tags"><span class="fc-tag fc-tag-${c.tag}">${TAG_LABEL[c.tag] || c.tag}</span>${queue ? `<span class="fc-queue fc-queue-${queue}">${QUEUE_LABEL[queue]}</span>` : ''}</span><span class="fc-deckname">${deckOf[c.id].emoji} ${esc(deckOf[c.id].name)}</span></div>`;
    const code = c.code ? `<pre class="fc-code"><code>${highlight(c.code.trim())}</code></pre>` : '';
    if (c.type === 'recall') return `${tag}<div class="fc-q">${c.front}</div>${code}<div class="fc-back" hidden><div class="fc-divider"></div>${c.back}</div>`;
    if (c.type === 'concept') {
      const row = (label, html) => html ? `<div class="fc-cx-row"><div class="fc-cx-label">${label}</div><div class="fc-cx-val">${html}</div></div>` : '';
      return `${tag}<div class="fc-term">${esc(c.term)}</div><p class="fc-term-prompt">Say it out loud before you flip:</p><ul class="fc-term-hints"><li>Definition</li><li>When it runs</li><li>Purpose</li><li>Syntax</li><li>Watch out</li></ul>
        <div class="fc-back fc-concept" hidden>
          ${row('Definition', c.def)}${row('When it runs', c.runs)}${row('Purpose', c.purpose)}
          ${c.syntax ? `<div class="fc-cx-row"><div class="fc-cx-label">Syntax</div><pre class="fc-code"><code>${highlight(c.syntax.trim())}</code></pre></div>` : ''}
          ${row('Watch out', c.pitfall)}
        </div>`;
    }
    return `${tag}<div class="fc-q">${c.q}</div>${code}
      <div class="fc-options" role="group" aria-label="Answers">${order.map((oi, i) =>
        `<button type="button" class="fc-opt" data-opt="${oi}"><span class="fc-opt-k">${i + 1}</span><span class="fc-opt-t">${c.options[oi]}</span></button>`).join('')}</div>
      <div class="fc-why" hidden></div>`;
  }

  function startStudy(deckId) {
    const cards = deckId ? decks.find(d => d.id === deckId).cards : allCards;
    session = { mode: 'study', cards, deckId, title: deckId ? decks.find(d => d.id === deckId).name : 'All decks', done: 0 };
    showNext();
  }

  function showNext(forced, keepOrder) {
    const ov = openOverlay();
    const s = session;
    const c = forced || nextCard(s.cards);
    const k = counts(s.cards);
    if (!c) return showDone(ov);
    s.current = c;
    s.revealed = false;
    s.order = keepOrder || (c.type === 'mcq' ? shuffle([0, 1, 2, 3]) : null);
    const st = state(c.id);
    const remaining = k.fresh + k.learn + k.due;
    const { card, actions, scroll } = shell(ov, {
      title: s.title,
      right: `${s.undo ? '<button type="button" class="fc-undo" data-act="undo" aria-label="Undo last answer">↶ Undo</button>' : ''}<span class="fc-counts">${countPills(k)}</span>`,
      progress: s.done / (s.done + remaining || 1)
    });
    card.innerHTML = cardBody(c, s.order, st.q);
    card.dataset.queue = st.q;
    scroll.scrollTop = 0;
    s.shownAt = Date.now();
    if (c.type !== 'mcq') {
      actions.innerHTML = `<button type="button" class="fc-btn fc-primary fc-wide" data-act="show">Show answer</button>`;
    } else {
      actions.innerHTML = `<p class="fc-hint">Pick an answer</p>`;
    }
  }

  function reveal(chosen) {
    const s = session, c = s.current;
    if (!s || s.revealed) return;
    s.revealed = true;
    const ov = document.querySelector('.fc-session');
    const actions = ov.querySelector('.fc-actions');
    let correct = true;
    if (c.type === 'mcq') {
      correct = chosen === c.answer;
      ov.querySelectorAll('.fc-opt').forEach(b => {
        const oi = +b.dataset.opt;
        b.disabled = true;
        if (oi === c.answer) b.classList.add('is-correct');
        else if (oi === chosen) b.classList.add('is-wrong');
        else b.classList.add('is-dim');
      });
      const why = ov.querySelector('.fc-why');
      why.hidden = false;
      why.innerHTML = `<div class="fc-verdict ${correct ? 'ok' : 'no'}">${correct ? '✓ Correct' : '✗ Not quite'}</div>${c.why}`;
      requestAnimationFrame(() => why.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
    } else {
      ov.querySelector('.fc-back').hidden = false;
    }
    s.correct = correct;
    const st = state(c.id), now = Date.now();
    // honest grading: a wrong multiple-choice answer can only be "Again"
    // honest grading: a wrong multiple-choice answer can only be "Again", and a slow first answer can't be "Easy"
    let grades = c.type === 'mcq' && !correct ? GRADES.slice(0, 1) : GRADES;
    if (c.type === 'mcq' && correct && st.q === 'new' && Date.now() - s.shownAt > 8000) grades = GRADES.slice(0, 3);
    actions.innerHTML = `<div class="fc-grades${grades.length === 1 ? ' single' : ''}">${grades.map(x =>
      `<button type="button" class="fc-grade fc-${x.key}" data-grade="${x.g}"><span>${x.label}</span><small>${fmtIvl(previewMs(st, x.g, now))}</small></button>`).join('')}</div>`;
  }

  function grade(g) {
    const s = session;
    if (!s || !s.revealed) return;
    const c = s.current;
    const t = today();
    const before = state(c.id);
    s.undo = { card: c, order: s.order, prev: store.data.cards[c.id], day: { ...t } };
    if (before.q === 'new') t.newSeen++;
    t.reviews++;
    if (g > 1) t.correct++;
    store.data.cards[c.id] = schedule(before, g, Date.now());
    store.save();
    s.done++;
    showNext();
  }

  function showDone(ov) {
    const s = session;
    const t = today();
    const { card, actions } = shell(ov, { title: s.title, progress: 1 });
    card.classList.add('fc-done');
    card.innerHTML = `<div class="fc-done-emoji" aria-hidden="true">🏁</div>
      <h2>${s.done ? 'Session complete' : 'Nothing due right now'}</h2>
      <p>${s.done ? `You reviewed ${s.done} card${s.done === 1 ? '' : 's'} this session.` : 'This deck has no cards due and no new cards left for today.'}</p>
      <div class="fc-stats small">
        <div><b>${streak()}</b><span>day streak</span></div>
        <div><b>${t.reviews}</b><span>today</span></div>
        <div><b>${t.reviews ? Math.round(t.correct / t.reviews * 100) + '%' : '–'}</b><span>correct</span></div>
      </div>
      <p class="fc-sub">${nextDueText(s.cards)}</p>`;
    actions.innerHTML = `<div class="fc-row">${newLeft() === 0 && s.cards.some(c => state(c.id).q === 'new') ? '<button type="button" class="fc-btn fc-ghost" data-act="more-new">Learn 10 more</button>' : ''}<button type="button" class="fc-btn fc-ghost" data-act="quiz-from-done">${s.deckId ? 'Quiz this deck' : 'Take a quiz'}</button><button type="button" class="fc-btn fc-primary" data-act="exit">Done</button></div>`;
  }

  /* ----- browse mode: flip through a deck in order, no grading, nothing saved ----- */
  function startBrowse(deckId) {
    const d = decks.find(x => x.id === deckId);
    session = { mode: 'browse', cards: d.cards, i: 0, title: `Browse · ${d.name}` };
    showBrowse();
  }
  function showBrowse() {
    const ov = openOverlay();
    const s = session;
    const c = s.current = s.cards[s.i];
    s.revealed = false;
    s.order = c.type === 'mcq' ? shuffle([0, 1, 2, 3]) : null;
    const { card, actions, scroll } = shell(ov, { title: s.title, right: `<span class="fc-quiz-pos">${s.i + 1}/${s.cards.length}</span>`, progress: (s.i + 1) / s.cards.length });
    card.innerHTML = cardBody(c, s.order);
    card.querySelectorAll('.fc-opt').forEach(b => { b.disabled = true; b.classList.add('is-inert'); });
    scroll.scrollTop = 0;
    actions.innerHTML = `<div class="fc-browse-bar"><button type="button" class="fc-btn fc-ghost" data-act="b-prev" aria-label="Previous card">‹</button><button type="button" class="fc-btn fc-primary" data-act="flip">Flip</button><button type="button" class="fc-btn fc-ghost" data-act="b-next" aria-label="Next card">›</button></div>`;
  }
  function browseFlip() {
    const s = session, c = s.current;
    if (!s || s.mode !== 'browse') return;
    const ov = document.querySelector('.fc-session');
    if (s.revealed) { s.revealed = false; showBrowse(); return; }
    s.revealed = true;
    if (c.type === 'mcq') {
      ov.querySelectorAll('.fc-opt').forEach(b => { const ok = +b.dataset.opt === c.answer; b.classList.add(ok ? 'is-correct' : 'is-dim'); if (ok) b.querySelector('.fc-opt-k').textContent = '✓'; });
      const why = ov.querySelector('.fc-why'); why.hidden = false; why.innerHTML = c.why;
    } else ov.querySelector('.fc-back').hidden = false;
    ov.querySelector('[data-act="flip"]').textContent = 'Hide';
  }

  /* ----- quiz mode (no scheduling, just practice) ----- */
  function startQuiz(deckId) {
    const pool = (deckId ? decks.find(d => d.id === deckId).cards : allCards).filter(c => c.type === 'mcq');
    if (deckId && !pool.length) return startQuiz(); // study-only deck: fall back to a mixed quiz
    const qs = shuffle(pool).slice(0, deckId ? Math.min(10, pool.length) : 15);
    session = { mode: 'quiz', qs, i: 0, score: 0, missed: [], title: `Quiz · ${deckId ? decks.find(d => d.id === deckId).name : 'Mixed'}` };
    showQuiz();
  }
  function showQuiz() {
    const ov = openOverlay();
    const s = session;
    if (s.i >= s.qs.length) return showQuizEnd(ov);
    const c = s.current = s.qs[s.i];
    s.revealed = false;
    s.order = shuffle([0, 1, 2, 3]);
    const { card, actions, scroll } = shell(ov, { title: s.title, right: `<span class="fc-quiz-pos">${s.i + 1}/${s.qs.length}</span>`, progress: s.i / s.qs.length });
    card.innerHTML = cardBody(c, s.order);
    scroll.scrollTop = 0;
    actions.innerHTML = `<p class="fc-hint">Pick an answer</p>`;
  }
  function quizReveal(chosen) {
    const s = session, c = s.current;
    if (s.revealed) return;
    s.revealed = true;
    const ov = document.querySelector('.fc-session');
    const ok = chosen === c.answer;
    if (ok) s.score++; else s.missed.push({ c, chosen });
    ov.querySelectorAll('.fc-opt').forEach(b => {
      const oi = +b.dataset.opt; b.disabled = true;
      b.classList.add(oi === c.answer ? 'is-correct' : oi === chosen ? 'is-wrong' : 'is-dim');
    });
    const why = ov.querySelector('.fc-why');
    why.hidden = false;
    why.innerHTML = `<div class="fc-verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✗ Not quite'}</div>${c.why}`;
    requestAnimationFrame(() => why.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
    ov.querySelector('.fc-actions').innerHTML = `<button type="button" class="fc-btn fc-primary fc-wide" data-act="quiz-next">${s.i + 1 < s.qs.length ? 'Next question' : 'See results'}</button>`;
  }
  function showQuizEnd(ov) {
    const s = session;
    const pct = Math.round(s.score / s.qs.length * 100);
    const { card, actions } = shell(ov, { title: s.title, progress: 1 });
    card.classList.add('fc-done');
    card.innerHTML = `<div class="fc-done-emoji" aria-hidden="true">${pct === 100 ? '🏆' : pct >= 70 ? '🎯' : '📚'}</div>
      <h2>${s.score} / ${s.qs.length} correct</h2>
      <p>${pct === 100 ? 'Flawless.' : pct >= 70 ? 'Solid. Review the misses below.' : 'These need work. Tap Redo misses to drill them now.'}</p>
      ${s.missed.length ? `<ul class="fc-missed">${s.missed.map(({ c, chosen }) => `<li><details><summary><div class="fc-missed-q">${c.q}</div><div class="fc-missed-a">Answer: ${c.options[c.answer]}</div><div class="fc-missed-you">You picked: ${c.options[chosen]}</div></summary>${c.code ? `<pre class="fc-code"><code>${highlight(c.code.trim())}</code></pre>` : ''}<div class="fc-missed-why">${c.why}</div></details></li>`).join('')}</ul>` : ''}`;
    actions.innerHTML = `<div class="fc-row">${s.missed.length ? `<button type="button" class="fc-btn fc-ghost" data-act="queue-missed">Redo misses</button>` : ''}<button type="button" class="fc-btn fc-primary" data-act="exit">Done</button></div>`;
  }
  function queueMissed() {
    const now = Date.now();
    for (const c of session.missed) {
      const st = state(c.id);
      store.data.cards[c.id] = st.q === 'new' ? schedule(st, 1, now - LEARN_STEPS[0]) : { ...st, due: Math.min(st.due, now), q: st.q === 'review' ? 'relearn' : st.q, step: 0 };
    }
    store.save();
    const missedIds = new Set(session.missed.map(c => c.id));
    session = { mode: 'study', cards: allCards.filter(c => missedIds.has(c.id)), title: 'Missed questions', done: 0 };
    showNext();
  }

  /* ----- events ----- */
  function onClick(e) {
    const t = e.target.closest('[data-act], [data-opt], [data-grade]');
    if (!t) return;
    if (t.dataset.opt !== undefined) {
      if (!session) return;
      return session.mode === 'quiz' ? quizReveal(+t.dataset.opt) : reveal(+t.dataset.opt);
    }
    if (t.dataset.grade) return grade(+t.dataset.grade);
    const act = t.dataset.act;
    const msg = root.querySelector('.fc-msg');
    switch (act) {
      case 'study': startStudy(t.dataset.deck); break;
      case 'settings': { const p = root.querySelector('#fc-settings'); p.open = true; p.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'more-new': today().extraNew = (today().extraNew || 0) + 10; store.save(); if (session) { session.done = session.done; showNext(); } else startStudy(); break;
      case 'quiz': startQuiz(t.dataset.deck); break;
      case 'browse': startBrowse(t.dataset.deck); break;
      case 'flip': browseFlip(); break;
      case 'b-next': session.i = (session.i + 1) % session.cards.length; showBrowse(); break;
      case 'b-prev': session.i = (session.i - 1 + session.cards.length) % session.cards.length; showBrowse(); break;
      case 'quiz-from-done': startQuiz((session && session.deckId) || undefined); break;
      case 'show': reveal(); break;
      case 'quiz-next': session.i++; showQuiz(); break;
      case 'queue-missed': queueMissed(); break;
      case 'exit': exitSession(); break;
      case 'undo': {
        const u = session && session.undo;
        if (!u) break;
        if (u.prev) store.data.cards[u.card.id] = u.prev; else delete store.data.cards[u.card.id];
        store.data.days[dayKey(Date.now())] = u.day;
        store.save();
        session.undo = null;
        session.done = Math.max(0, session.done - 1);
        showNext(u.card, u.order);
        break;
      }
      case 'new-minus': case 'new-plus': {
        const s = store.data.settings;
        s.newPerDay = Math.max(0, Math.min(100, s.newPerDay + (act === 'new-plus' ? 5 : -5)));
        store.save();
        root.querySelector('[data-new-limit]').textContent = s.newPerDay; // update in place so the stepper doesn't jump
        const note = root.querySelector('.fc-limit-note');
        if (note) note.textContent = `${newLeft()} of ${s.newPerDay + (today().extraNew || 0)} new cards left today, shared across decks.`;
        break;
      }
      case 'backup': {
        const code = store.exportCode();
        const done = ok => { msg.textContent = ok ? 'Backup code copied. Paste it into Restore on your other device.' : 'Copy this code:'; if (!ok) { const ta = root.querySelector('#fc-restore-input'); root.querySelector('.fc-restore').hidden = false; ta.value = code; ta.select(); } };
        try { navigator.clipboard.writeText(code).then(() => done(true), () => done(false)); } catch { done(false); }
        break;
      }
      case 'restore-open': root.querySelector('.fc-restore').hidden = false; root.querySelector('#fc-restore-input').focus(); break;
      case 'restore':
        if (!t.dataset.armed) {
          let n = '?';
          try { n = Object.keys(JSON.parse(decodeURIComponent(escape(atob(root.querySelector('#fc-restore-input').value.trim())))).cards || {}).length; } catch { msg.textContent = 'That code did not work. Copy the whole backup code and try again.'; break; }
          t.dataset.armed = '1';
          t.textContent = `Replace ${Object.keys(store.data.cards).length} cards here with ${n} from the code?`;
          break;
        }
        try { store.importCode(root.querySelector('#fc-restore-input').value); renderHome(); openPanel(1); root.querySelector('.fc-msg').textContent = 'Progress restored.'; }
        catch { msg.textContent = 'That code did not work. Copy the whole backup code and try again.'; }
        break;
      case 'reset':
        if (t.dataset.armed) { store.reset(); renderHome(); openPanel(1); root.querySelector('.fc-msg').textContent = 'Review progress erased. Your settings were kept.'; }
        else { t.dataset.armed = '1'; t.textContent = 'Tap again to erase all review progress'; }
        break;
    }
  }
  function openPanel(i) { const p = root.querySelectorAll('.fc-panel')[i]; if (p) p.open = true; }
  function onKey(e) {
    if (!session || /input|textarea/i.test(document.activeElement.tagName)) return;
    const n = parseInt(e.key, 10);
    if (e.key === 'Escape') { exitSession(); return; }
    if (session.mode === 'browse') {
      if (e.key === 'ArrowRight') { session.i = (session.i + 1) % session.cards.length; showBrowse(); }
      else if (e.key === 'ArrowLeft') { session.i = (session.i - 1 + session.cards.length) % session.cards.length; showBrowse(); }
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); browseFlip(); }
      return;
    }
    if (!session.revealed) {
      if (session.current && session.current.type === 'mcq' && n >= 1 && n <= 4) {
        const oi = session.order[n - 1];
        session.mode === 'quiz' ? quizReveal(oi) : reveal(oi);
      } else if ((e.key === ' ' || e.key === 'Enter') && session.current && session.current.type !== 'mcq') { e.preventDefault(); session.mode === 'browse' ? browseFlip() : reveal(); }
    } else if (session.mode === 'study' && n >= 1 && n <= 4 && document.querySelector(`.fc-grade[data-grade="${n}"]`)) grade(n);
    else if (session.mode === 'study' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); const b = document.querySelector('.fc-grade.fc-good') || document.querySelector('.fc-grade'); b && grade(+b.dataset.grade); }
    else if (session.mode === 'quiz' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.i++; showQuiz(); }
  }

  const onPop = () => { if (session) renderHome(); };
  window.addEventListener('popstate', onPop);
  root.addEventListener('click', onClick);
  const ovClick = e => { if (e.target.closest('.fc-session')) onClick(e); };
  document.addEventListener('click', ovClick);
  document.addEventListener('keydown', onKey);
  renderHome();
  return {
    destroy() {
      closeSession();
      root.removeEventListener('click', onClick);
      document.removeEventListener('click', ovClick);
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('popstate', onPop);
    },
    // test hooks
    _store: store, _schedule: schedule
  };
}

var DECKS = [];
DECKS.push({
  id: 'clauses',
  name: 'Clauses & Keywords',
  emoji: '📖',
  blurb: 'Study cards: what each clause does, when it runs, why you use it.',
  cards: [
    { id: 'clauses-01', type: 'concept', tag: 'term',
      term: 'SELECT',
      def: `Chooses which columns or expressions appear in the result, producing one output row for each row that reached it.`,
      runs: `5th: after FROM, WHERE, GROUP BY and HAVING; before DISTINCT, ORDER BY and LIMIT.`,
      purpose: `Pick and compute the columns a report needs, such as a rider's fare plus tip as a total.`,
      syntax: `WITH rides(rider, fare, tip) AS (
  VALUES ('Ana', 18.50, 3.00),
         ('Ben', 22.00, 4.00))
SELECT rider, fare + tip AS total
FROM rides;`,
      pitfall: `SELECT * pulls every column: wasteful, and fragile when the table changes. List the columns you need.` },

    { id: 'clauses-02', type: 'concept', tag: 'term',
      term: 'FROM',
      def: `Names the tables, views or subqueries that supply the rows; JOINs extend it into a combined row set.`,
      runs: `1st: builds the row set that every other clause then works on.`,
      purpose: `Choose the source of the data, such as orders alone or orders joined to customers.`,
      syntax: `WITH orders(order_id, amount) AS (
  VALUES (1, 40.00), (2, 15.50))
SELECT order_id, amount
FROM orders;`,
      pitfall: `FROM orders, customers with no join condition pairs every order with every customer (a cross join).` },

    { id: 'clauses-03', type: 'concept', tag: 'term',
      term: 'AS (alias)',
      def: `Gives a column, expression or table a temporary name that exists only for the duration of the query.`,
      runs: `Table alias: 1st, in FROM. Column alias: 5th, set in SELECT; usable in ORDER BY (and GROUP BY in PostgreSQL).`,
      purpose: `Label a computed column such as annual salary, or shorten a table name like employees e.`,
      syntax: `WITH employees(name, salary) AS (
  VALUES ('Ana', 5000), ('Ben', 6200))
SELECT e.name, e.salary * 12 AS annual
FROM employees AS e
ORDER BY annual;`,
      pitfall: `A column alias is not visible in WHERE or HAVING, because they run before SELECT. Repeat the expression.` },

    { id: 'clauses-04', type: 'concept', tag: 'term',
      term: 'WHERE',
      def: `Keeps only the rows for which a condition is true, discarding rows where it is false or NULL.`,
      runs: `2nd: after FROM/JOIN, before GROUP BY. It sees raw rows, not groups.`,
      purpose: `Filter rows early, for example only shipped orders, before any grouping or sorting.`,
      syntax: `WITH orders(order_id, amount, status) AS (
  VALUES (1, 40.00, 'shipped'),
         (2, 15.50, 'pending'))
SELECT order_id, amount
FROM orders
WHERE status = 'shipped';`,
      pitfall: `Cannot use aggregates like sum() (use HAVING) or SELECT aliases (not defined yet).` },

    { id: 'clauses-05', type: 'concept', tag: 'term',
      term: 'ORDER BY',
      def: `Sorts the result by one or more expressions, ascending by default; DESC reverses a key.`,
      runs: `7th: after SELECT and DISTINCT, before LIMIT. May use SELECT aliases, but only as a bare name, not inside an expression.`,
      purpose: `Rank results, such as the highest-paid employees first or the newest orders at the top.`,
      syntax: `WITH employees(name, dept, salary) AS (
  VALUES ('Ana', 'Eng', 90), ('Ben', 'Ops', 70),
         ('Cy', 'Eng', 80))
SELECT name, dept, salary
FROM employees
ORDER BY dept, salary DESC;`,
      pitfall: `Without ORDER BY the row order is not guaranteed. In PostgreSQL, NULLs sort last in ASC and first in DESC.` },

    { id: 'clauses-06', type: 'concept', tag: 'term',
      term: 'LIMIT',
      def: `Caps the number of rows the query returns.`,
      runs: `8th (last): after ORDER BY, so it trims the already-sorted result.`,
      purpose: `Top-N queries, such as the 3 most expensive products, or a quick preview of a big table.`,
      syntax: `WITH products(sku, name, price) AS (
  VALUES ('A1', 'Lamp', 30), ('B2', 'Desk', 220),
         ('C3', 'Chair', 95))
SELECT name, price
FROM products
ORDER BY price DESC
LIMIT 2;`,
      pitfall: `LIMIT without ORDER BY returns arbitrary rows that can change between runs. Always sort first.` },

    { id: 'clauses-07', type: 'concept', tag: 'term',
      term: 'OFFSET',
      def: `Skips the first N rows of the sorted result before LIMIT starts counting.`,
      runs: `8th, with LIMIT: after ORDER BY, it discards N rows and then the page is returned.`,
      purpose: `Page through results, such as page 3 of a product list with 20 items per page (OFFSET 40).`,
      syntax: `SELECT sku, name
FROM products
ORDER BY sku
LIMIT 20 OFFSET 40;`,
      pitfall: `PostgreSQL still reads and throws away the skipped rows, so deep pages are slow and shift as rows change. Prefer keyset paging.`,
      noRun: true },

    { id: 'clauses-08', type: 'concept', tag: 'term',
      term: 'FETCH FIRST ... WITH TIES',
      def: `SQL-standard row limit that also returns any further rows tying with the last returned row on the ORDER BY value.`,
      runs: `8th: after ORDER BY; adds rows equal to the Nth row on the sort key.`,
      purpose: `Top 2 salaries without arbitrarily cutting off employees who earn the same amount as the 2nd.`,
      syntax: `WITH employees(name, salary) AS (
  VALUES ('Ana', 90), ('Ben', 80),
         ('Cy', 80), ('Di', 60))
SELECT name, salary
FROM employees
ORDER BY salary DESC
FETCH FIRST 2 ROWS WITH TIES;`,
      pitfall: `Requires ORDER BY, and may return more than N rows. Use plain LIMIT when you need exactly N.` },

    { id: 'clauses-09', type: 'concept', tag: 'term',
      term: 'DISTINCT',
      def: `Removes duplicate rows from the result, comparing all the selected columns together.`,
      runs: `6th: after SELECT computes the columns, before ORDER BY and LIMIT.`,
      purpose: `List each city where rides happened once, instead of one row per ride.`,
      syntax: `WITH rides(rider, city) AS (
  VALUES ('Ana', 'Austin'), ('Ben', 'Austin'),
         ('Cy', 'Denver'))
SELECT DISTINCT city
FROM rides;`,
      pitfall: `It dedups whole rows, not one column: SELECT DISTINCT city, rider still returns every distinct pair.` },

    { id: 'clauses-10', type: 'concept', tag: 'term',
      term: 'DISTINCT ON',
      def: `PostgreSQL extension that keeps only the first row for each distinct value of the listed expressions, as ranked by ORDER BY.`,
      runs: `6th: after SELECT, before LIMIT; ORDER BY decides which row counts as first for each key.`,
      purpose: `Latest order per customer: one row each, without a window function or self-join.`,
      syntax: `WITH orders(customer, amount, ordered_at) AS (
  VALUES ('Ana', 40, date '2025-01-03'),
         ('Ana', 25, date '2025-02-10'),
         ('Ben', 60, date '2025-01-20'))
SELECT DISTINCT ON (customer)
       customer, amount, ordered_at
FROM orders
ORDER BY customer, ordered_at DESC;`,
      pitfall: `ORDER BY must start with the DISTINCT ON expressions, and without a clear sort the surviving row is arbitrary.` },

    { id: 'clauses-11', type: 'concept', tag: 'term',
      term: 'GROUP BY',
      def: `Collapses rows that share the same values into one group, so aggregates like sum() and count() run once per group.`,
      runs: `3rd: after WHERE; aggregates are computed here, before HAVING and SELECT use them.`,
      purpose: `Totals per bucket, such as revenue per customer or rides per city.`,
      syntax: `WITH orders(customer, amount) AS (
  VALUES ('Ana', 40), ('Ana', 25), ('Ben', 60))
SELECT customer, sum(amount) AS total
FROM orders
GROUP BY customer;`,
      pitfall: `Every SELECT column must be grouped, aggregated, or depend on a grouped primary key; otherwise PostgreSQL raises an error.` },

    { id: 'clauses-12', type: 'concept', tag: 'term',
      term: 'HAVING',
      def: `Filters whole groups after aggregation, using conditions on aggregates such as sum() or count().`,
      runs: `4th: after GROUP BY, before SELECT. Sees groups, not raw rows.`,
      purpose: `Keep only customers whose total spend passes a threshold, such as over 100.`,
      syntax: `WITH orders(customer, amount) AS (
  VALUES ('Ana', 40), ('Ana', 85), ('Ben', 60))
SELECT customer, sum(amount) AS total
FROM orders
GROUP BY customer
HAVING sum(amount) > 100;`,
      pitfall: `Do not put row-level tests in HAVING; use WHERE so rows are dropped before grouping, which is cheaper.` },

    { id: 'clauses-13', type: 'concept', tag: 'term',
      term: 'BETWEEN',
      def: `True when a value lies in a range, with both endpoints included.`,
      runs: `Inside a condition: per row in WHERE (2nd) or ON; per group in HAVING (4th).`,
      purpose: `Select orders in a price band or rides within a date range.`,
      syntax: `WITH orders(order_id, amount) AS (
  VALUES (1, 40), (2, 15), (3, 100))
SELECT order_id
FROM orders
WHERE amount BETWEEN 20 AND 100;`,
      pitfall: `Timestamps: BETWEEN '2025-01-01' AND '2025-01-31' misses everything after midnight on Jan 31. Use &gt;= start and &lt; next day.` },

    { id: 'clauses-14', type: 'concept', tag: 'term',
      term: 'IN',
      def: `True when a value equals any item in a list or in the rows returned by a subquery.`,
      runs: `Inside a condition: per row in WHERE (2nd) or ON; per group in HAVING (4th).`,
      purpose: `Match several statuses at once, such as orders that are shipped or pending.`,
      syntax: `WITH orders(order_id, status) AS (
  VALUES (1, 'shipped'), (2, 'cancelled'),
         (3, 'pending'))
SELECT order_id
FROM orders
WHERE status IN ('shipped', 'pending');`,
      pitfall: `NOT IN returns no rows at all if the list or subquery contains a NULL. Use NOT EXISTS instead.` },

    { id: 'clauses-15', type: 'concept', tag: 'term',
      term: 'LIKE / ILIKE',
      def: `Pattern match on text: % matches any run of characters, _ matches exactly one. ILIKE (PostgreSQL) ignores case.`,
      runs: `Inside a condition: tested per row in WHERE (2nd).`,
      purpose: `Search for customers whose name starts with 'an', or products with a keyword in the name.`,
      syntax: `WITH customers(name) AS (
  VALUES ('Anna'), ('Ben'), ('ANDY'))
SELECT name
FROM customers
WHERE name ILIKE 'an%';`,
      pitfall: `LIKE is case-sensitive, and a leading wildcard ('%shoe') cannot use a normal B-tree index, so it scans the table.` },

    { id: 'clauses-16', type: 'concept', tag: 'term',
      term: 'IS NULL',
      def: `True when a value is missing (NULL). Comparisons such as = NULL cannot test for it, because they yield NULL.`,
      runs: `Inside a condition: tested per row in WHERE (2nd), or in ON.`,
      purpose: `Find rides where no tip was recorded.`,
      syntax: `WITH rides(rider, tip) AS (
  VALUES ('Ana', 3.00), ('Ben', NULL),
         ('Cy', 0.00))
SELECT rider
FROM rides
WHERE tip IS NULL;`,
      pitfall: `tip = NULL is never true (it yields NULL), and tip &lt;&gt; 0 also drops the NULL rows. Use IS NULL or IS DISTINCT FROM.` },

    { id: 'clauses-17', type: 'concept', tag: 'term',
      term: 'CASE',
      def: `Expression that returns the result of the first WHEN condition that is true, else the ELSE value (NULL if there is none).`,
      runs: `Per row wherever an expression is allowed: SELECT (5th), ORDER BY, or inside aggregates.`,
      purpose: `Bucket values into labels, such as classing a fare as short, medium or long.`,
      syntax: `WITH rides(rider, fare) AS (
  VALUES ('Ana', 8.00), ('Ben', 24.00))
SELECT rider,
  CASE WHEN fare < 10 THEN 'short'
       WHEN fare < 20 THEN 'medium'
       ELSE 'long' END AS size
FROM rides;`,
      pitfall: `Branches are tested top to bottom and stop at the first match, so order them carefully. Omitting ELSE silently yields NULL.` },

    { id: 'clauses-18', type: 'concept', tag: 'term',
      term: 'INNER JOIN',
      def: `Combines rows from two tables where the ON condition matches, discarding rows with no match on either side.`,
      runs: `1st: part of FROM; builds the combined row set before WHERE.`,
      purpose: `Attach customer names to orders, listing only orders that have a matching customer.`,
      syntax: `WITH customers(customer_id, name) AS (
  VALUES (1, 'Ana'), (2, 'Ben')),
orders(order_id, customer_id) AS (
  VALUES (10, 1), (11, 1))
SELECT c.name, o.order_id
FROM customers c
INNER JOIN orders o
  ON o.customer_id = c.customer_id;`,
      pitfall: `Unmatched rows vanish silently: Ben has no orders, so he disappears. Use LEFT JOIN to keep him.` },

    { id: 'clauses-19', type: 'concept', tag: 'term',
      term: 'LEFT JOIN',
      def: `Keeps every row of the left table; columns from the right table are NULL when no row matches.`,
      runs: `1st: part of FROM; unmatched left rows are added after matching.`,
      purpose: `List all customers with their orders, including customers who never ordered.`,
      syntax: `WITH customers(customer_id, name) AS (
  VALUES (1, 'Ana'), (2, 'Ben')),
orders(order_id, customer_id) AS (
  VALUES (10, 1))
SELECT c.name, o.order_id
FROM customers c
LEFT JOIN orders o
  ON o.customer_id = c.customer_id;`,
      pitfall: `A WHERE on a right-table column (o.status = 'shipped') drops the NULL rows, silently making it an inner join. Put it in ON.` },

    { id: 'clauses-20', type: 'concept', tag: 'term',
      term: 'RIGHT JOIN',
      def: `Keeps every row of the right table; columns from the left table are NULL when no row matches.`,
      runs: `1st: part of FROM; the mirror image of LEFT JOIN.`,
      purpose: `List every song with its streams, including songs nobody has streamed yet.`,
      syntax: `WITH streams(song, plays) AS (
  VALUES ('Aria', 120)),
songs(song, artist) AS (
  VALUES ('Aria', 'Lia'), ('Blue', 'Kai'))
SELECT s.song, st.plays
FROM streams st
RIGHT JOIN songs s ON s.song = st.song;`,
      pitfall: `Reads backwards and is easy to misread; swap the table order and use LEFT JOIN instead. WHERE on left columns also undoes it.` },

    { id: 'clauses-21', type: 'concept', tag: 'term',
      term: 'FULL OUTER JOIN',
      def: `Keeps every row from both tables, matching where possible and filling the other side with NULLs where not.`,
      runs: `1st: part of FROM; combines matched, left-only and right-only rows.`,
      purpose: `Reconcile two lists, such as warehouse stock against billing records, to find items on only one side.`,
      syntax: `WITH stock(sku, qty) AS (
  VALUES ('A1', 5), ('B2', 0)),
billed(sku, amount) AS (
  VALUES ('B2', 9), ('C3', 4))
SELECT sku, qty, amount
FROM stock
FULL JOIN billed USING (sku);`,
      pitfall: `A WHERE on one side's column removes the NULL-padded rows and defeats the join. Test with IS NULL on purpose to find mismatches.` },

    { id: 'clauses-22', type: 'concept', tag: 'term',
      term: 'CROSS JOIN',
      def: `Pairs every row of one table with every row of the other, with no join condition.`,
      runs: `1st: part of FROM; produces rows(A) x rows(B) rows.`,
      purpose: `Generate every combination, such as each product in each size, or each employee for each calendar day.`,
      syntax: `WITH products(name) AS (
  VALUES ('Shirt'), ('Hat')),
sizes(size) AS (
  VALUES ('S'), ('M'), ('L'))
SELECT p.name, s.size
FROM products p
CROSS JOIN sizes s;`,
      pitfall: `Row counts multiply: 10,000 x 10,000 is 100 million rows. It often appears by accident when a join condition is forgotten.` },

    { id: 'clauses-23', type: 'concept', tag: 'term',
      term: 'Self-join',
      def: `Joins a table to itself under two aliases so each row can be matched with another row of the same table.`,
      runs: `1st: part of FROM; the table is read twice under different aliases.`,
      purpose: `Show each employee next to their manager's name, since both live in the employees table.`,
      syntax: `WITH employees(name, manager) AS (
  VALUES ('Ana', NULL), ('Ben', 'Ana'),
         ('Cy', 'Ben'))
SELECT e.name, m.name AS boss
FROM employees e
LEFT JOIN employees m
  ON m.name = e.manager;`,
      pitfall: `Aliases are mandatory. With INNER JOIN, the top employee (manager NULL) disappears; use LEFT JOIN to keep them.` },

    { id: 'clauses-24', type: 'concept', tag: 'term',
      term: 'USING (column)',
      def: `Join shorthand for equality on a column with the same name in both tables; the column appears once in the output.`,
      runs: `1st: part of JOIN in FROM, instead of ON.`,
      purpose: `Shorter joins when keys share a name, such as customers and orders on customer_id.`,
      syntax: `WITH customers(customer_id, name) AS (
  VALUES (1, 'Ana'), (2, 'Ben')),
orders(order_id, customer_id) AS (
  VALUES (10, 1), (11, 2))
SELECT *
FROM customers
JOIN orders USING (customer_id);`,
      pitfall: `Only works for equal, identically named columns. For different names or non-equality tests, you must use ON.` },

    { id: 'clauses-25', type: 'concept', tag: 'term',
      term: 'LATERAL',
      def: `Lets a subquery in FROM refer to columns of tables listed before it, so it runs once for each of their rows.`,
      runs: `1st: in FROM; the subquery is evaluated per row of the preceding table.`,
      purpose: `Top-N per group, such as each customer's single largest order, using ORDER BY and LIMIT inside.`,
      syntax: `SELECT c.name, top.amount
FROM customers c
LEFT JOIN LATERAL (
  SELECT amount FROM orders o
  WHERE o.customer_id = c.customer_id
  ORDER BY amount DESC LIMIT 1
) top ON true;`,
      pitfall: `With a plain JOIN LATERAL, customers with no orders vanish; use LEFT JOIN LATERAL ... ON true to keep them.`,
      noRun: true },

    { id: 'clauses-26', type: 'concept', tag: 'term',
      term: 'Subquery in FROM',
      def: `A SELECT in parentheses used like a table (a derived table); the outer query reads its result rows and columns.`,
      runs: `1st: in FROM; the inner query produces its rows before the outer clauses run.`,
      purpose: `Aggregate first, then work on the result, such as averaging each customer's total spend.`,
      syntax: `WITH orders(customer, amount) AS (
  VALUES ('Ana', 40), ('Ana', 25), ('Ben', 60))
SELECT avg(t.total) AS avg_spend
FROM (SELECT customer, sum(amount) AS total
      FROM orders
      GROUP BY customer) AS t;`,
      pitfall: `Name every computed column inside (sum(amount) AS total); otherwise the outer query sees it as plain sum.` },

    { id: 'clauses-27', type: 'concept', tag: 'term',
      term: 'EXISTS',
      def: `True when the subquery returns at least one row; it stops at the first match and ignores what is selected.`,
      runs: `In WHERE (2nd): the correlated subquery is checked for each outer row.`,
      purpose: `Find customers who have placed at least one order, or with NOT EXISTS, those who never did.`,
      syntax: `WITH customers(customer_id, name) AS (
  VALUES (1, 'Ana'), (2, 'Ben')),
orders(order_id, customer_id) AS (
  VALUES (10, 1))
SELECT c.name
FROM customers c
WHERE EXISTS (SELECT 1 FROM orders o
  WHERE o.customer_id = c.customer_id);`,
      pitfall: `Forget the link condition inside the subquery and EXISTS is true for every row whenever any order exists.` },

    { id: 'clauses-28', type: 'concept', tag: 'term',
      term: 'UNION',
      def: `Stacks the results of two queries into one and removes duplicate rows.`,
      runs: `After each query's own steps; combines the two results, then dedups.`,
      purpose: `One list of every person's name from both customers and employees.`,
      syntax: `WITH customers(name) AS (
  VALUES ('Ana'), ('Ben')),
employees(name) AS (
  VALUES ('Ben'), ('Cy'))
SELECT name FROM customers
UNION
SELECT name FROM employees;`,
      pitfall: `Dedup costs a sort or hash and merges legitimate repeats. Both queries need the same column count and compatible types.` },

    { id: 'clauses-29', type: 'concept', tag: 'term',
      term: 'UNION ALL',
      def: `Stacks the results of two queries into one and keeps every row, duplicates included.`,
      runs: `After each query's own steps; simply appends the second result to the first.`,
      purpose: `Combine same-shaped tables such as orders_2024 and orders_2025, or log tables, quickly.`,
      syntax: `WITH orders_2024(order_id, amount) AS (
  VALUES (1, 40), (2, 15)),
orders_2025(order_id, amount) AS (
  VALUES (3, 60))
SELECT * FROM orders_2024
UNION ALL
SELECT * FROM orders_2025;`,
      pitfall: `A row present in both sources appears twice, which inflates counts and sums. Choose UNION if that is wrong.` },

    { id: 'clauses-30', type: 'concept', tag: 'term',
      term: 'INTERSECT',
      def: `Returns only the rows that appear in the results of both queries, with duplicates removed.`,
      runs: `After each query's own steps; keeps rows common to both results.`,
      purpose: `Find users who logged in on both Monday and Tuesday.`,
      syntax: `WITH logins(user_name, login_date) AS (
  VALUES ('ana', date '2025-03-03'),
         ('ben', date '2025-03-03'),
         ('ana', date '2025-03-04'))
SELECT user_name FROM logins
WHERE login_date = '2025-03-03'
INTERSECT
SELECT user_name FROM logins
WHERE login_date = '2025-03-04';`,
      pitfall: `It compares entire rows. Add login_date to either SELECT and nothing matches, because the dates differ.` },

    { id: 'clauses-31', type: 'concept', tag: 'term',
      term: 'EXCEPT',
      def: `Returns the rows of the first query that do not appear in the second, with duplicates removed.`,
      runs: `After each query's own steps; subtracts the second result from the first.`,
      purpose: `Churn check: users who logged in last week but not this week.`,
      syntax: `WITH logins(user_name, login_date) AS (
  VALUES ('ana', date '2025-03-03'),
         ('ben', date '2025-03-03'),
         ('ana', date '2025-03-10'))
SELECT user_name FROM logins
WHERE login_date = '2025-03-03'
EXCEPT
SELECT user_name FROM logins
WHERE login_date = '2025-03-10';`,
      pitfall: `Order matters: A EXCEPT B is not B EXCEPT A. Swapping the queries answers the opposite question.` },

    { id: 'clauses-32', type: 'concept', tag: 'term',
      term: 'WITH (CTE)',
      def: `Names a subquery up front (a common table expression) so the rest of the statement can use it like a table.`,
      runs: `Before the main query: each CTE is available to later parts of the statement.`,
      purpose: `Break a long query into readable steps, such as totals per customer first, then filtering the big spenders.`,
      syntax: `WITH orders(customer, amount) AS (
  VALUES ('Ana', 40), ('Ana', 85), ('Ben', 60)),
totals AS (
  SELECT customer, sum(amount) AS total
  FROM orders GROUP BY customer)
SELECT customer FROM totals
WHERE total > 100;`,
      pitfall: `A CTE referenced once is inlined into the main query (PostgreSQL 12+), not run separately. Add MATERIALIZED to force one run.` },

    { id: 'clauses-33', type: 'concept', tag: 'term',
      term: 'WITH RECURSIVE',
      def: `A CTE that refers to itself: a seed query starts the rows, then a recursive query repeats on the previous step's rows.`,
      runs: `Seed runs once, then the recursive part loops until it returns no new rows.`,
      purpose: `Walk hierarchies, such as every employee under a manager in the org chart.`,
      syntax: `WITH RECURSIVE down AS (
  SELECT name, 1 AS lvl FROM employees
  WHERE manager IS NULL
  UNION ALL
  SELECT e.name, d.lvl + 1 FROM employees e
  JOIN down d ON e.manager = d.name
) SELECT * FROM down;`,
      pitfall: `Cyclic data (A manages B manages A) loops forever. Guard with a depth limit or the CYCLE clause (PostgreSQL 14+).`,
      noRun: true },

    { id: 'clauses-34', type: 'concept', tag: 'term',
      term: 'OVER / PARTITION BY',
      def: `OVER makes a function a window function; PARTITION BY splits rows into groups it calculates over, without collapsing them.`,
      runs: `5th, during SELECT: after WHERE, GROUP BY and HAVING, before DISTINCT and ORDER BY. Every input row is kept.`,
      purpose: `Show each employee's salary beside their department average, or rank them within the department.`,
      syntax: `WITH employees(name, dept, salary) AS (
  VALUES ('Ana', 'Eng', 90), ('Ben', 'Eng', 80),
         ('Cy', 'Ops', 70))
SELECT name, dept, salary,
  avg(salary) OVER (PARTITION BY dept) AS avg_d
FROM employees;`,
      pitfall: `Window functions cannot appear in WHERE or GROUP BY. Wrap the query in a CTE to filter on a rank.` },

    { id: 'clauses-35', type: 'concept', tag: 'term',
      term: 'Window frame (ROWS BETWEEN)',
      def: `Limits which rows around the current row a window function sees, such as ROWS BETWEEN 2 PRECEDING AND CURRENT ROW.`,
      runs: `5th, during SELECT: inside OVER, per row, over the frame within its partition's ORDER BY.`,
      purpose: `Moving averages and running totals, such as the average of the last 3 rides' fares.`,
      syntax: `SELECT ride_date, fare,
  avg(fare) OVER (
    ORDER BY ride_date
    ROWS BETWEEN 2 PRECEDING
             AND CURRENT ROW) AS avg3
FROM rides;`,
      pitfall: `With ORDER BY and no frame, the default is RANGE, which includes tied peer rows; use ROWS for exact running totals.`,
      noRun: true },

    { id: 'clauses-36', type: 'concept', tag: 'term',
      term: 'FILTER (WHERE ...)',
      def: `Restricts one aggregate to rows matching a condition, without removing those rows from the other aggregates.`,
      runs: `3rd: aggregates are computed at GROUP BY, after WHERE; FILTER trims only its own aggregate's input rows.`,
      purpose: `Count total and shipped orders per customer in a single pass.`,
      syntax: `WITH orders(customer, status) AS (
  VALUES ('Ana', 'shipped'), ('Ana', 'pending'),
         ('Ben', 'shipped'))
SELECT customer, count(*) AS total,
  count(*) FILTER (WHERE status = 'shipped')
    AS shipped
FROM orders GROUP BY customer;`,
      pitfall: `Put FILTER right after the aggregate call. A plain WHERE would change every aggregate, not just one.` },

    { id: 'clauses-37', type: 'concept', tag: 'term',
      term: 'INSERT ... RETURNING',
      def: `INSERT adds new rows to a table; RETURNING sends back columns of the rows just written, such as generated ids.`,
      runs: `On execution: writes the rows, applies defaults, then returns the new rows to you.`,
      purpose: `Create an order and get its new order_id back in one round trip, with no follow-up SELECT.`,
      syntax: `INSERT INTO orders (customer, amount)
VALUES ('Ana', 40.00)
RETURNING order_id, ordered_at;`,
      pitfall: `With ON CONFLICT DO NOTHING, a skipped row returns nothing, so an empty RETURNING does not mean an error.`,
      noRun: true },

    { id: 'clauses-38', type: 'concept', tag: 'term',
      term: 'UPDATE',
      def: `Changes column values in the existing rows that match its WHERE condition.`,
      runs: `On execution: WHERE finds the rows, each gets a new version; permanent once committed.`,
      purpose: `Fix or progress data in place, such as marking one order as cancelled.`,
      syntax: `UPDATE orders
SET status = 'cancelled'
WHERE order_id = 7
RETURNING order_id, status;`,
      pitfall: `Forgetting WHERE updates every row in the table. Preview with SELECT or run inside BEGIN so you can ROLLBACK.`,
      noRun: true },

    { id: 'clauses-39', type: 'concept', tag: 'term',
      term: 'DELETE',
      def: `Removes the rows that match its WHERE condition from a table.`,
      runs: `On execution: WHERE finds the rows and marks them dead; VACUUM reclaims the space later.`,
      purpose: `Remove obsolete data, such as old logins past a retention period.`,
      syntax: `DELETE FROM logins
WHERE login_date < date '2024-01-01';`,
      pitfall: `Without WHERE it deletes every row. Foreign keys may block it or cascade to child rows, so check before running.`,
      noRun: true },

    { id: 'clauses-40', type: 'concept', tag: 'term',
      term: 'EXPLAIN',
      def: `Shows the execution plan PostgreSQL would use for a statement; EXPLAIN ANALYZE also runs it and reports actual times and row counts.`,
      runs: `Plain EXPLAIN only plans. With ANALYZE the statement really executes, then stats are shown.`,
      purpose: `Find why a query is slow, such as a sequential scan on orders where an index scan was expected.`,
      syntax: `EXPLAIN ANALYZE
SELECT *
FROM orders
WHERE customer = 'Ana';`,
      pitfall: `EXPLAIN ANALYZE really performs INSERT, UPDATE and DELETE. Wrap it in BEGIN ... ROLLBACK to avoid changing data.`,
      noRun: true }
  ]
});

  id: 'functions-ref',
