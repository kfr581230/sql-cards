    { id: 'windows-08', type: 'mcq', tag: 'theory',
      q: `Two rows tie on the ORDER BY of <code>row_number() OVER (ORDER BY v)</code>. What numbers do they get?`,
      options: [`The same number`, `The same number, then a gap`, `NULL for both`, `Different numbers, in arbitrary order`],
      answer: 3,
      why: `row_number() always assigns unique consecutive numbers; between tied rows the order is arbitrary unless you add a tiebreaker column. Sharing a number is what rank() does.` },

    { id: 'windows-09', type: 'mcq', tag: 'output',
      q: `What are the ntile values for 5 rows?`,
      code: `SELECT v, ntile(2) OVER (ORDER BY v) b

    { id: 'windows-10', type: 'mcq', tag: 'output',
      q: `What is the lag column?`,

    { id: 'windows-11', type: 'mcq', tag: 'output',
      q: `What is the lag column?`,
      code: `SELECT v, lag(v, 2, -1) OVER (ORDER BY v)

    { id: 'windows-12', type: 'mcq', tag: 'output',
      q: `What is column d?`,

    { id: 'windows-13', type: 'mcq', tag: 'output',
      q: `What is the last_value column?`,
      code: `SELECT v, last_value(v) OVER (ORDER BY v)

    { id: 'windows-14', type: 'mcq', tag: 'debug',
      q: `last_value(v) OVER (ORDER BY v) just echoes the current row. Which frame returns the partition's last value?`,

      q: `What is the moving average column?`,

    { id: 'windows-17', type: 'mcq', tag: 'theory',
      q: `How does a RANGE frame differ from a ROWS frame?`,

      answer: 2,

    { id: 'windows-18', type: 'mcq', tag: 'debug', noRun: true,

    { id: 'windows-19', type: 'mcq', tag: 'order',

    { id: 'windows-20', type: 'mcq', tag: 'output',
      q: `Which rows does this return?`,
      code: `WITH t(g,v) AS (VALUES

    { id: 'windows-21', type: 'mcq', tag: 'interview',

    { id: 'windows-22', type: 'mcq', tag: 'syntax',
      q: `Where does the named <code>WINDOW w AS (...)</code> clause go in a SELECT?`,
      options: [`After HAVING, before ORDER BY`, `After ORDER BY`, `Between FROM and WHERE`, `Before SELECT, like WITH`],

    { id: 'windows-23', type: 'mcq', tag: 'output',

    { id: 'windows-24', type: 'mcq', tag: 'postgres',
      q: `In PostgreSQL, which of these accepts <code>FILTER (WHERE ...)</code> before OVER?`,

    { id: 'windows-r01', type: 'recall', tag: 'theory',

    { id: 'execution-11', type: 'mcq', tag: 'theory',

    { id: 'execution-14', type: 'mcq', tag: 'theory',

    { id: 'execution-15', type: 'mcq', tag: 'postgres',
      q: `How many PRIMARY KEY and UNIQUE constraints can one PostgreSQL table have?`,
      options: [`One of each`, `One PRIMARY KEY, any number of UNIQUE`, `Any number of each`, `Any number of PRIMARY KEY, one UNIQUE`],
      answer: 1,
      why: `A table has at most one primary key (possibly composite) but any number of UNIQUE constraints. "One of each" is tempting; UNIQUE has no such cap.` },
    { id: 'execution-16', type: 'mcq', tag: 'theory',
      q: `What does a FOREIGN KEY constraint guarantee?`,
      options: [`The referencing column is automatically indexed`, `Joins on that column run faster`, `Referenced rows can never be deleted`, `Non-NULL values exist in the referenced key`],
      answer: 3,
      why: `Every non-NULL value must match a row in the referenced table. PostgreSQL does not auto-index the referencing column, and ON DELETE CASCADE can delete referenced rows.` },
    { id: 'execution-17', type: 'mcq', tag: 'theory',
      q: `A column storing 'red,blue,green' in one value violates which normal form?`,
      options: [`1NF`, `2NF`, `3NF`, `BCNF`],
      answer: 0,
      why: `1NF requires atomic values: one value per cell. Use a child table instead. 2NF and 3NF concern dependencies on keys and assume 1NF already holds.` },
    { id: 'execution-18', type: 'mcq', tag: 'interview',
      q: `emp(id PK, dept_id, dept_name): dept_name depends on dept_id. Which normal form does this break?`,
      options: [`1NF`, `2NF`, `3NF`, `None; it is fully normalized`],
      answer: 2,
      why: `A non-key column depending on another non-key column is a transitive dependency, which 3NF forbids. 2NF is about partial dependency on part of a composite key; this key is one column.` },
    { id: 'execution-19', type: 'mcq', tag: 'postgres',
      q: `What is PostgreSQL's default transaction isolation level?`,
      options: [`Read Uncommitted`, `Read Committed`, `Repeatable Read`, `Serializable`],
      answer: 1,
      why: `The default is Read Committed: each statement sees data committed before that statement began. Stricter levels must be requested explicitly.` },
    { id: 'execution-20', type: 'mcq', tag: 'interview',
      q: `Index on (last_name, first_name). Which filter best uses the leading column to narrow the search?`,
      options: [`WHERE first_name = 'Ana'`, `WHERE first_name LIKE 'A%'`, `WHERE last_name <> 'Kim'`, `WHERE last_name = 'Kim'`],
      answer: 3,
      why: `A composite B-tree is sorted by the first column, then the second. Equality on the leading column gives a tight range. Filters on first_name alone lack the leading column.` },
    { id: 'execution-21', type: 'mcq', tag: 'interview',
      q: `A plain B-tree index exists on email. Why can't WHERE lower(email) = 'a@x.io' use it?`,
      options: [`The index stores raw values, not lower(email)`, `B-tree indexes only work on numeric columns`, `Indexes cannot serve equality on text`, `lower() is volatile, so never indexable`],
      answer: 0,
      why: `The index is sorted by email, not lower(email). Build an expression index on lower(email) or rewrite the predicate. lower() is immutable, so it is indexable.` },
    { id: 'execution-22', type: 'mcq', tag: 'theory',
      q: `Why can't a B-tree index help WHERE name LIKE '%son'?`,
      options: [`LIKE can never use any kind of index`, `B-trees only support equality comparisons`, `The index is sorted from the first character`, `The wildcard forces a cast that blocks indexes`],
      answer: 2,
      why: `A B-tree orders values from the first character, so a known prefix gives a range. A leading % has no prefix. A pg_trgm GIN index can serve it, so "never any index" is wrong.` },
    { id: 'execution-23', type: 'mcq', tag: 'syntax',
      q: `Which statement runs the query and reports actual row counts and timings?`,
      options: [`EXPLAIN VERBOSE SELECT ...`, `EXPLAIN ANALYZE SELECT ...`, `EXPLAIN (COSTS) SELECT ...`, `ANALYZE SELECT ...`],
      answer: 1,
      why: `The ANALYZE option executes the statement and measures it. Plain EXPLAIN shows only estimates. A standalone ANALYZE refreshes table statistics and is not a plan command.` },
    { id: 'execution-24', type: 'mcq', tag: 'interview',
      q: `A transfer debits account A, then crashes before crediting B. Which ACID property undoes the debit?`,
      options: [`Consistency`, `Isolation`, `Durability`, `Atomicity`],
      answer: 3,
      why: `Atomicity makes a transaction all-or-nothing, so the debit is rolled back. Durability is about committed data surviving crashes; Isolation is about concurrent transactions.` },

    { id: 'execution-r01', type: 'recall', tag: 'order',
      front: `List the logical processing order of a SELECT query.`,
      back: `<code>FROM/JOIN</code> → <code>WHERE</code> → <code>GROUP BY</code> → <code>HAVING</code> → <code>SELECT</code> (incl. window functions) → <code>DISTINCT</code> → <code>ORDER BY</code> → <code>LIMIT/OFFSET</code>.` },
    { id: 'execution-r02', type: 'recall', tag: 'theory',
      front: `In ACID, what does Isolation guarantee?`,
      back: `Concurrent transactions do not see each other's partial work. How much they do see depends on the isolation level (Read Committed, Repeatable Read, Serializable).` },
    { id: 'execution-r03', type: 'recall', tag: 'interview',
      front: `Make index-friendly: <code>WHERE extract(year FROM hire_date) = 2020</code>`,
      back: `<code>WHERE hire_date &gt;= '2020-01-01' AND hire_date &lt; '2021-01-01'</code>. Keep the column bare so a B-tree range scan works.` },
    { id: 'execution-r04', type: 'recall', tag: 'theory',
      front: `What is the main cost of denormalizing a table?`,
      back: `Redundant data can drift out of sync, and writes get more complex because every copy must be updated. The gain is fewer joins and faster reads.` },
    { id: 'execution-r05', type: 'recall', tag: 'order',
      front: `Name three ways to reuse a computed expression in a WHERE filter.`,
      back: `Repeat the expression; wrap the query in a subquery/CTE and filter outside; or compute it in <code>CROSS JOIN LATERAL (SELECT expr AS alias)</code>.` },
    { id: 'execution-r06', type: 'recall', tag: 'postgres',
      front: `How can you EXPLAIN ANALYZE an UPDATE without keeping its changes?`,
      back: `ANALYZE really executes it. Wrap it: <code>BEGIN; EXPLAIN ANALYZE UPDATE ...; ROLLBACK;</code>` }
  ]
});
DECKS.push({
  id: 'set-ops',
  name: 'Set Operations & Pivoting',
  emoji: '🙏',
  blurb: 'UNION, INTERSECT, EXCEPT, precedence, pivot and unpivot.',
  cards: [
    { id: 'set-ops-01', type: 'mcq', tag: 'theory',
      q: `How does UNION differ from UNION ALL?`,
      options: [`UNION removes duplicates; UNION ALL keeps all rows`, `UNION keeps duplicates; UNION ALL removes them`, `UNION sorts the rows; UNION ALL does not`, `UNION needs matching names; UNION ALL does not`],
      answer: 0,
      why: `UNION returns distinct rows; UNION ALL simply appends. Neither promises sorted output, and neither cares about column names, only count and types.` },
    { id: 'set-ops-02', type: 'mcq', tag: 'output',
      q: `How many rows does this return?`,
      code: `SELECT 1 AS n
UNION ALL
SELECT 1
UNION
SELECT 2;`,
      options: [`3`, `4`, `2`, `1`],
      answer: 2,
      why: `Operators combine left to right: (1 UNION ALL 1) UNION 2. The final UNION deduplicates the whole accumulated result, leaving 1 and 2. Only a trailing UNION ALL keeps duplicates.` },
    { id: 'set-ops-03', type: 'mcq', tag: 'theory',
      q: `Why is UNION ALL usually faster than UNION?`,
      options: [`It runs both queries in parallel`, `It skips the duplicate-removal sort or hash step`, `It can use indexes that UNION cannot`, `It returns only the first query's rows`],
      answer: 1,
      why: `UNION must sort or hash all rows to find duplicates. UNION ALL just streams both inputs. Use it whenever duplicates are impossible or acceptable.` },
    { id: 'set-ops-04', type: 'mcq', tag: 'debug', noRun: true,
      q: `What happens when this runs?`,
      code: `SELECT first_name, last_name
FROM employees
UNION
SELECT department_name
FROM departments;`,
      options: [`The missing column is padded with NULL`, `It runs and ignores last_name`, `It works only if written as UNION ALL`, `Error: each query needs the same column count`],
      answer: 3,
      why: `PostgreSQL requires every query in a set operation to return the same number of columns. It never pads with NULL; add NULL AS last_name yourself.` },
    { id: 'set-ops-05', type: 'mcq', tag: 'postgres', noRun: true,
      q: `Why does this fail in PostgreSQL?`,
      code: `SELECT employee_id
FROM employees
UNION
SELECT department_name
FROM departments;`,
      options: [`integer and text have no common type`, `UNION requires identical column names`, `PostgreSQL never converts types in a UNION`, `The first query needs an ORDER BY`],
      answer: 0,
      why: `Error: UNION types integer and text cannot be matched. PostgreSQL does resolve compatible types (integer with numeric works), so "never converts" is wrong. Cast explicitly.` },
    { id: 'set-ops-06', type: 'mcq', tag: 'output',
      q: `What are the result column names?`,
      code: `SELECT 1 AS a, 2 AS b
UNION ALL
SELECT 3 AS x, 4 AS y;`,
      options: [`x, y`, `a, y`, `a, b`, `?column?, ?column?`],
      answer: 2,
      why: `Column names come from the first query only. Later aliases are ignored; columns are matched by position, not by name.` },
    { id: 'set-ops-07', type: 'mcq', tag: 'order',
      q: `In SELECT ... UNION ALL SELECT ... ORDER BY n, which rows does the trailing ORDER BY sort?`,
      options: [`Only the last SELECT`, `The entire combined result`, `Only the first SELECT`, `Each SELECT separately`],
      answer: 1,
      why: `A trailing ORDER BY (and LIMIT) belongs to the whole set operation. To sort one branch only, wrap it in parentheses with its own LIMIT.` },
    { id: 'set-ops-08', type: 'mcq', tag: 'debug', noRun: true,
      q: `This raises a syntax error near UNION. Why?`,
      code: `SELECT first_name
FROM employees
ORDER BY first_name
UNION
SELECT department_name
FROM departments;`,
      options: [`ORDER BY is forbidden with UNION`, `UNION needs ALL when sorting`, `first_name needs a table alias`, `ORDER BY must trail the whole query`],
      answer: 3,
      why: `A bare ORDER BY can only trail the whole set operation. Move it to the end, or wrap that SELECT in parentheses (usually with a LIMIT). It is not forbidden outright.` },
    { id: 'set-ops-09', type: 'mcq', tag: 'syntax',
      q: `What does INTERSECT return?`,
      options: [`Distinct rows that appear in both queries`, `Distinct rows in the first query but not the second`, `All rows from both queries, deduplicated`, `Every pairing of rows from both queries`],
      answer: 0,
      why: `INTERSECT keeps rows present in both inputs, deduplicated. Rows only in the first is EXCEPT, all rows deduplicated is UNION, and every pairing is a CROSS JOIN.` },
    { id: 'set-ops-10', type: 'mcq', tag: 'output',
      q: `Which x values does this return?`,
      code: `SELECT x FROM (VALUES (1),(2),(2),(3)) v(x)
EXCEPT
SELECT 2
ORDER BY x;`,
      options: [`1, 2, 3`, `1, 2, 2, 3`, `1, 3`, `2`],
      answer: 2,
      why: `EXCEPT removes every left row equal to a right row, so both 2s go, and the result is distinct. Subtracting by count is EXCEPT ALL.` },
    { id: 'set-ops-11', type: 'mcq', tag: 'output',
      q: `Which x values does this return?`,
      code: `SELECT x FROM (VALUES (1),(2),(2),(3)) v(x)
EXCEPT ALL
SELECT 2
ORDER BY x;`,
      options: [`1, 3`, `1, 2, 3`, `1, 2, 2, 3`, `2`],
      answer: 1,
      why: `EXCEPT ALL subtracts occurrences: two 2s minus one 2 leaves one 2. Plain EXCEPT would remove every 2.` },
    { id: 'set-ops-12', type: 'mcq', tag: 'output',
      q: `How many rows does this return?`,
      code: `SELECT x FROM (VALUES (1),(1),(1)) v(x)
INTERSECT ALL
SELECT x FROM (VALUES (1),(1)) v(x);`,
      options: [`1`, `3`, `5`, `2`],
      answer: 3,
      why: `INTERSECT ALL keeps min(left count, right count) copies: min(3, 2) = 2. Plain INTERSECT would return a single row.` },
    { id: 'set-ops-13', type: 'mcq', tag: 'order',
      q: `How many rows does this return?`,
      code: `SELECT 1 AS n
UNION
SELECT 2
INTERSECT
SELECT 2;`,
      options: [`2`, `1`, `3`, `0`],
      answer: 0,
      why: `INTERSECT binds tighter than UNION: 2 INTERSECT 2 = {2}, then 1 UNION {2} = {1, 2}. Strict left-to-right would give one row, {2}.` },
    { id: 'set-ops-14', type: 'mcq', tag: 'order',
      q: `What does this return?`,
      code: `SELECT 1 AS n
UNION
SELECT 2
EXCEPT
SELECT 1;`,
      options: [`1, 2`, `1`, `2`, `Nothing`],
      answer: 2,
      why: `UNION and EXCEPT share one precedence level and run left to right: (1 UNION 2) EXCEPT 1 = 2. Only INTERSECT binds tighter. Use parentheses to be explicit.` },
    { id: 'set-ops-15', type: 'mcq', tag: 'theory',
      q: `How does UNION combine result sets, compared with JOIN?`,
      options: [`UNION adds columns; JOIN adds rows`, `UNION adds rows; JOIN adds columns`, `UNION matches by key; JOIN matches by position`, `They differ only in duplicate handling`],
      answer: 1,
      why: `UNION stacks result sets vertically, matching columns by position. JOIN widens rows horizontally using a condition. The key-versus-position option is backwards.` },
    { id: 'set-ops-16', type: 'mcq', tag: 'output',
      q: `What does this conditional aggregation return?`,
      code: `SELECT
  sum(CASE WHEN k = 'a' THEN v END) AS a,
  sum(CASE WHEN k = 'b' THEN v END) AS b
FROM (VALUES ('a',1),('a',2),('b',5))
  AS t(k, v);`,
      options: [`One row: a=2, b=1`, `Two rows: one for a, one for b`, `Error: CASE needs an ELSE`, `One row: a=3, b=5`],
      answer: 3,
      why: `CASE without ELSE yields NULL for non-matching rows and sum() ignores NULLs, so a = 1+2 = 3 and b = 5. Aggregates without GROUP BY collapse everything into one row.` },
    { id: 'set-ops-17', type: 'mcq', tag: 'theory',
      q: `In a conditional-aggregation pivot, how are the output columns chosen?`,
      options: [`You list each one in the SELECT`, `They come from the distinct values of k`, `They are set by the ORDER BY clause`, `They are set by the GROUP BY clause`],
      answer: 0,
      why: `Each pivoted column is its own sum(...) FILTER or CASE expression, so the column list is fixed in the SQL text. A dynamic list needs SQL generated by your application.` },
    { id: 'set-ops-18', type: 'mcq', tag: 'interview',
      q: `Why use UNION ALL, not UNION, when unpivoting columns into rows?`,
      options: [`UNION cannot take more than two queries`, `UNION requires the same names in each query`, `UNION would merge rows that happen to be equal`, `UNION is not allowed with constant labels`],
      answer: 2,
      why: `Unpivoted rows are distinct source cells even if two values match. UNION would collapse equal rows and silently lose data, and it costs a dedup step.` },
    { id: 'set-ops-19', type: 'mcq', tag: 'output',
      q: `What does this unpivot return?`,
      code: `SELECT t.id, u.k, u.v
FROM (VALUES (1, 10, 20)) AS t(id, a, b)
CROSS JOIN LATERAL (VALUES ('a', t.a),
  ('b', t.b)) AS u(k, v);`,
      options: [`One row: (1, 10, 20)`, `Rows (1, a, 10) and (1, b, 20)`, `Rows (1, a, 20) and (1, b, 10)`, `Error: VALUES cannot reference t`],
      answer: 1,
      why: `LATERAL lets the VALUES list see t.a and t.b, emitting one row per tuple for each input row. VALUES can reference t here precisely because of LATERAL.` },
    { id: 'set-ops-20', type: 'mcq', tag: 'postgres',
      q: `Which PostgreSQL extension provides the crosstab() pivot function?`,
      options: [`hstore`, `pg_trgm`, `pivot`, `tablefunc`],
      answer: 3,
      why: `crosstab() lives in the tablefunc extension (CREATE EXTENSION tablefunc). PostgreSQL has no built-in PIVOT keyword; that is SQL Server and Oracle.` },

    { id: 'set-ops-r01', type: 'recall', tag: 'syntax',
      front: `How do you pivot rows into columns without crosstab?`,
      back: `Conditional aggregation: <code>sum(v) FILTER (WHERE k = 'a')</code> or <code>sum(CASE WHEN k = 'a' THEN v END)</code>, one per output column, with GROUP BY for the row key.` },
    { id: 'set-ops-r02', type: 'recall', tag: 'theory',
      front: `Name two ways to unpivot columns into rows.`,
      back: `<code>UNION ALL</code> of one SELECT per column, or <code>CROSS JOIN LATERAL (VALUES ('a', t.a), ('b', t.b))</code>, which scans the table only once.` },
    { id: 'set-ops-r03', type: 'recall', tag: 'theory',
      front: `What must be true of the SELECTs inside a UNION?`,
      back: `They return the same number of columns, with compatible types matched by position.` },
    { id: 'set-ops-r04', type: 'recall', tag: 'theory',
      front: `What do INTERSECT ALL and EXCEPT ALL do with duplicates?`,
      back: `INTERSECT ALL keeps the smaller of the two counts of each row; EXCEPT ALL subtracts the right count from the left count. Without ALL, both return distinct rows.` }
  ]
});
DECKS.push({
  id: 'functions',

    { id: 'functions-01', type: 'mcq', tag: 'output',

    { id: 'functions-03', type: 'mcq', tag: 'output',

    { id: 'functions-16', type: 'mcq', tag: 'output',
      q: `What does this return?`,

    { id: 'functions-17', type: 'mcq', tag: 'output',

    { id: 'functions-18', type: 'mcq', tag: 'output',
