<style>
:root {
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --bg-sunk: #eef0f4;
  --surface: #ffffff;
  --ink: #161b26;
  --ink-2: #3a4252;
  --muted: #687184;
  --line: #e4e7ec;
  --line-2: #d3d8e0;
  --accent: #2b59c3;
  --accent-2: #1f46a3;
  --accent-soft: #e9effc;
  --accent-ink: #ffffff;
  --hl: #ffe27a;
  --good: #12804a;
  --good-soft: #e6f6ed;
  --good-line: #9fd8b8;
  --bad: #c22f2f;
  --bad-soft: #fdecec;
  --bad-line: #f0b4b4;
  --warn-soft: #fff6e0;
  --warn-line: #f1d48a;
  --code-bg: #f5f6f8;
  --code-ink: #1d2330;
  --inline-code: #eef0f3;
  --t-k: #7c3aed;
  --t-f: #0f6fb8;
  --t-s: #0f7a3d;
  --t-n: #b4500b;
  --t-c: #8a93a3;
  --t-o: #6b5b95;
  --t-i: #9a3412;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .06);
  --shadow: 0 1px 3px rgba(16, 24, 40, .08), 0 4px 16px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 40px rgba(16, 24, 40, .14);
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-head: 'Kumbh Sans', 'Inter', ui-sans-serif, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --header-h: 64px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --bg-soft: #141923; --bg-sunk: #1a2030; --surface: #151a24;
    --ink: #e8ebf1; --ink-2: #c3c9d5; --muted: #8d96a8; --line: #252c3a; --line-2: #343d50;
    --accent: #6b93ff; --accent-2: #8aa9ff; --accent-soft: #1b2643; --accent-ink: #0b1020;
    --hl: #6b5a14; --good: #4cc98a; --good-soft: #10291d; --good-line: #22573c;
    --bad: #ff7b7b; --bad-soft: #2e1517; --bad-line: #6b2b2e; --warn-soft: #2a2312; --warn-line: #5c4a1c;
    --code-bg: #10141c; --code-ink: #dfe4ee; --inline-code: #1f2533;
    --t-k: #c4a5ff; --t-f: #7cc4ff; --t-s: #8be0a4; --t-n: #ffb27a; --t-c: #6c7689; --t-o: #b9a7e8; --t-i: #ffa07a;
    --shadow-sm: none; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 6px 24px rgba(0,0,0,.35); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --bg-soft: #141923; --bg-sunk: #1a2030; --surface: #151a24;
  --ink: #e8ebf1; --ink-2: #c3c9d5; --muted: #8d96a8; --line: #252c3a; --line-2: #343d50;
  --accent: #6b93ff; --accent-2: #8aa9ff; --accent-soft: #1b2643; --accent-ink: #0b1020;
  --hl: #6b5a14; --good: #4cc98a; --good-soft: #10291d; --good-line: #22573c;
  --bad: #ff7b7b; --bad-soft: #2e1517; --bad-line: #6b2b2e; --warn-soft: #2a2312; --warn-line: #5c4a1c;
  --code-bg: #10141c; --code-ink: #dfe4ee; --inline-code: #1f2533;
  --t-k: #c4a5ff; --t-f: #7cc4ff; --t-s: #8be0a4; --t-n: #ffb27a; --t-c: #6c7689; --t-o: #b9a7e8; --t-i: #ffa07a;
  --shadow-sm: none; --shadow: 0 1px 0 rgba(255,255,255,.03), 0 6px 24px rgba(0,0,0,.35); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
  color-scheme: dark;
}


*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
h1, h2 { font-family: var(--font-head); line-height: 1.2; margin: 0; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.t-k { color: var(--t-k); font-weight: 600; } .t-f { color: var(--t-f); } .t-s { color: var(--t-s); } .t-n { color: var(--t-n); }
.t-c { color: var(--t-c); font-style: italic; } .t-o { color: var(--t-o); } .t-i { color: var(--t-i); }
.offline-note { max-width: 720px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 13px; }
/* Review (spaced repetition). Phone-first: 375px wide, thumb-reachable actions,
   safe-area aware, no hover dependence. Uses the site's color tokens. */
.fc-home { max-width: 720px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
.fc-hero h1 { font-size: 34px; font-weight: 800; margin: 2px 0 6px; }
.fc-kicker { font-size: 12.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.fc-lead { color: var(--ink-2); margin: 0 0 16px; font-size: 16px; }
.fc-sub { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
.fc-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 16px; }
.fc-stats.small { grid-template-columns: repeat(3, 1fr); margin: 18px 0 4px; }
.fc-stats > div { background: var(--bg-soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px 8px; text-align: center; min-width: 0; }
.fc-stats b { display: block; font: 800 22px/1.15 var(--font-head); color: var(--ink); font-variant-numeric: tabular-nums; }
.fc-stats span { display: block; font-size: 11.5px; color: var(--muted); line-height: 1.3; margin-top: 2px; }

.fc-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 18px;
  border-radius: 12px; border: 1px solid transparent; font: 600 16px var(--font); cursor: pointer;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
}
.fc-btn:disabled { opacity: .6; cursor: default; }
.fc-primary { background: var(--accent); color: var(--accent-ink); }
.fc-ghost { background: var(--surface); color: var(--ink); border-color: var(--line-2); }
.fc-wide { width: 100%; }
.fc-study { width: 100%; min-height: 56px; font-size: 17px; justify-content: space-between; padding: 0 20px; }
.fc-study:disabled { justify-content: center; background: var(--good-soft); color: var(--good); opacity: 1; }
.fc-row { display: flex; gap: 10px; }
.fc-row > .fc-btn { flex: 1; }

.fc-counts { display: inline-flex; gap: 6px; font-variant-numeric: tabular-nums; }
.fc-n { min-width: 26px; padding: 2px 7px; border-radius: 99px; font: 700 13px/1.4 var(--font); text-align: center; }
.fc-new { background: color-mix(in srgb, #3b82f6 16%, transparent); color: #2563eb; }
.fc-learn { background: color-mix(in srgb, #ef4444 14%, transparent); color: #dc2626; }
.fc-due { background: color-mix(in srgb, #16a34a 15%, transparent); color: #15803d; }
:root[data-theme="dark"] .fc-new { color: #8ab4ff; } :root[data-theme="dark"] .fc-learn { color: #ff8f8f; } :root[data-theme="dark"] .fc-due { color: #6fdc98; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fc-new { color: #8ab4ff; } :root:not([data-theme="light"]) .fc-learn { color: #ff8f8f; } :root:not([data-theme="light"]) .fc-due { color: #6fdc98; } }
.fc-primary .fc-n { background: rgba(255,255,255,.22); color: inherit; }

.fc-decks { margin-top: 28px; }
.fc-section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.fc-section-h h2 { font-size: 22px; font-weight: 800; }
.fc-legend .fc-n { font-size: 11px; min-width: 0; }
.fc-decks ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.fc-deck { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.fc-deck-main {
  flex: 1; min-width: 0; display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px;
  padding: 12px 10px 12px 12px; background: none; border: 0; text-align: left; cursor: pointer; color: var(--ink);
  touch-action: manipulation; -webkit-tap-highlight-color: transparent; font: inherit;
}
.fc-deck-main:active { background: var(--bg-soft); }
.fc-deck-emoji { font-size: 24px; text-align: center; font-family: 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif; }
.fc-deck-text { min-width: 0; display: grid; gap: 2px; }
.fc-deck-name { font: 700 16px/1.25 var(--font-head); }
.fc-deck-blurb { font-size: 13px; color: var(--muted); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fc-bar { display: block; height: 4px; border-radius: 99px; background: var(--bg-sunk); margin-top: 6px; overflow: hidden; }
.fc-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.fc-deck .fc-counts { flex-direction: column; gap: 3px; align-items: flex-end; }
.fc-quiz-btn { flex: none; width: 58px; border: 0; border-left: 1px solid var(--line); background: var(--bg-soft); color: var(--accent); font: 700 13px var(--font); cursor: pointer; touch-action: manipulation; }
.fc-quiz-btn:active { background: var(--accent-soft); }
.fc-quiz-all { width: 100%; margin-top: 10px; }

.fc-panel { margin-top: 16px; border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; background: var(--surface); }
.fc-panel > summary { cursor: pointer; list-style: none; padding: 14px 0; font: 700 16px var(--font-head); display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
.fc-panel > summary::-webkit-details-marker { display: none; }
.fc-panel > summary::after { content: '+'; font-size: 22px; color: var(--muted); }
.fc-panel[open] > summary::after { content: '–'; }
.fc-panel[open] { padding-bottom: 16px; }
.fc-rules { margin: 0; padding-left: 20px; display: grid; gap: 10px; font-size: 15px; color: var(--ink-2); }
.fc-setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 600; }
.fc-stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
.fc-stepper button { width: 48px; height: 44px; border: 0; background: var(--bg-soft); font: 700 20px var(--font); color: var(--ink); cursor: pointer; touch-action: manipulation; }
.fc-stepper b { min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.fc-panel .fc-row { margin-top: 12px; }
.fc-restore { margin-top: 10px; display: grid; gap: 8px; }
.fc-restore textarea { width: 100%; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-soft); color: var(--ink); padding: 10px; font: 13px var(--mono); font-size: 16px; }
.fc-msg { font-size: 14px; color: var(--good); margin-top: 8px; }
.fc-msg:empty { display: none; }
.fc-link-danger { margin-top: 14px; background: none; border: 0; color: var(--bad); font: 600 14px var(--font); padding: 8px 0; cursor: pointer; }

/* ---------- full-screen study session ---------- */
html.fc-locked, html.fc-locked body { overflow: hidden; overscroll-behavior: none; }
.fc-session {
  position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
  height: 100vh; height: 100dvh; background: var(--bg); color: var(--ink);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
.fc-top { display: grid; grid-template-columns: 48px 1fr auto; align-items: center; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 6px) 12px 6px 6px; border-bottom: 1px solid var(--line); }
.fc-x { width: 44px; height: 44px; border: 0; background: none; font-size: 20px; color: var(--ink-2); cursor: pointer; border-radius: 10px; touch-action: manipulation; }
.fc-top-title { font: 700 15px var(--font-head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-quiz-pos { font: 700 14px var(--font); color: var(--muted); font-variant-numeric: tabular-nums; }
.fc-progress { height: 3px; background: var(--bg-sunk); }
.fc-progress span { display: block; height: 100%; background: var(--accent); transition: width .25s ease; }
.fc-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.fc-card { max-width: 640px; margin: 0 auto; padding: 18px 18px 28px; }
.fc-meta { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; font-size: 12.5px; }
.fc-tag { font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.fc-tag-output, .fc-tag-debug { color: #a15c00; background: var(--warn-soft); }
.fc-tag-order { color: var(--good); background: var(--good-soft); }
.fc-deckname { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fc-q { font: 600 19px/1.45 var(--font); color: var(--ink); }
.fc-q code, .fc-opt-t code, .fc-why code, .fc-back code, .fc-missed code, .fc-rules code { font: 600 .88em var(--mono); background: var(--inline-code); padding: .08em .35em; border-radius: 5px; overflow-wrap: anywhere; font-variant-ligatures: none; }
.fc-code { margin: 14px 0 0; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 12px; font: 14px/1.6 var(--mono); color: var(--code-ink); white-space: pre-wrap; overflow-wrap: anywhere; font-variant-ligatures: none; }
.fc-options { display: grid; gap: 10px; margin-top: 18px; }
.fc-opt {
  display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; width: 100%; min-height: 56px;
  padding: 12px 14px; text-align: left; border: 1.5px solid var(--line-2); border-radius: 14px; background: var(--surface);
  color: var(--ink); font: 500 16px/1.4 var(--font); cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
.fc-opt:active:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); }
.fc-opt-k { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--bg-sunk); font: 700 13px var(--font); color: var(--muted); }
.fc-opt.is-correct { border-color: var(--good); background: var(--good-soft); }
.fc-opt.is-correct .fc-opt-k { background: var(--good); color: #fff; }
.fc-opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.fc-opt.is-wrong .fc-opt-k { background: var(--bad); color: #fff; }
.fc-opt.is-dim { opacity: .5; }
.fc-why, .fc-back { margin-top: 16px; padding: 14px 16px; border-radius: 14px; background: var(--bg-soft); border: 1px solid var(--line); font-size: 16px; line-height: 1.55; color: var(--ink-2); animation: fc-in .2s ease; }
.fc-back { background: var(--surface); }
.fc-divider { display: none; }
.fc-verdict { font: 800 16px var(--font-head); margin-bottom: 4px; }
.fc-verdict.ok { color: var(--good); } .fc-verdict.no { color: var(--bad); }
@keyframes fc-in { from { opacity: 0; transform: translateY(4px); } }

.fc-actions { border-top: 1px solid var(--line); padding: 10px 12px calc(env(safe-area-inset-bottom, 0px) + 10px); background: var(--bg); }
.fc-actions > * { max-width: 640px; margin-left: auto; margin-right: auto; }
.fc-hint { text-align: center; color: var(--muted); font-size: 14px; margin: 0; min-height: 48px; display: grid; place-items: center; }
.fc-grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.fc-grades.single { grid-template-columns: 1fr; }
.fc-grade {
  min-height: 58px; border-radius: 14px; border: 0; cursor: pointer; display: grid; place-items: center; align-content: center; gap: 1px;
  font: 700 16px var(--font); touch-action: manipulation; -webkit-tap-highlight-color: transparent; color: #fff;
}
.fc-grade small { font: 600 12px var(--font); opacity: .85; }
.fc-grade:active { filter: brightness(.92); transform: scale(.98); }
.fc-again { background: #dc2626; } .fc-hard { background: #6b7280; } .fc-good { background: #16a34a; } .fc-easy { background: #2563eb; }

.fc-done { text-align: center; padding-top: 40px; }
.fc-done h2 { font-size: 26px; margin: 6px 0; }
.fc-done p { color: var(--ink-2); }
.fc-done-emoji { font-size: 48px; }
.fc-missed { list-style: none; padding: 0; margin: 18px 0 0; text-align: left; display: grid; gap: 8px; }
.fc-missed li { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--surface); }
.fc-missed-q { font-weight: 600; font-size: 15px; }
.fc-missed-a { font-size: 14px; color: var(--good); margin-top: 4px; }

@media (min-width: 720px) {
  .fc-hero h1 { font-size: 40px; }
  .fc-q { font-size: 21px; }
  .fc-card { padding-top: 32px; }
}
@media (max-width: 380px) {
  .fc-stats { grid-template-columns: repeat(2, 1fr); }
  .fc-grade { font-size: 15px; }
}
@media (prefers-reduced-motion: reduce) { .fc-why, .fc-back { animation: none; } .fc-progress span { transition: none; } }
.fc-top-right { display: flex; align-items: center; gap: 8px; }
.fc-undo { height: 34px; padding: 0 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font: 600 13px var(--font); cursor: pointer; touch-action: manipulation; white-space: nowrap; }

/* round 2: critic fixes */
.fc-study .fc-n { background: color-mix(in srgb, var(--accent-ink) 20%, transparent) !important; color: var(--accent-ink) !important; }
.fc-hero-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.fc-gear { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2); font: 600 13px var(--font); cursor: pointer; touch-action: manipulation; }
.fc-warn { background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--ink-2); margin: 0 0 12px; }
.fc-more { margin-top: 10px; }
.fc-limit-note { margin: -2px 0 10px; }
.fc-deck.is-idle .fc-deck-name, .fc-deck.is-idle .fc-deck-emoji { opacity: .65; }
.fc-idle { font: 700 12.5px var(--font); color: var(--good); white-space: nowrap; }
.fc-tags { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.fc-queue { font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.fc-queue-new { background: color-mix(in srgb, #3b82f6 14%, transparent); color: #2563eb; }
.fc-queue-learn, .fc-queue-relearn { background: color-mix(in srgb, #ef4444 13%, transparent); color: #dc2626; }
.fc-queue-review { background: color-mix(in srgb, #16a34a 14%, transparent); color: #15803d; }
:root[data-theme="dark"] .fc-queue-new { color: #8ab4ff; } :root[data-theme="dark"] .fc-queue-learn, :root[data-theme="dark"] .fc-queue-relearn { color: #ff8f8f; } :root[data-theme="dark"] .fc-queue-review { color: #6fdc98; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fc-queue-new { color: #8ab4ff; } :root:not([data-theme="light"]) .fc-queue-learn, :root:not([data-theme="light"]) .fc-queue-relearn { color: #ff8f8f; } :root:not([data-theme="light"]) .fc-queue-review { color: #6fdc98; } }
.fc-missed details > summary { list-style: none; cursor: pointer; }
.fc-missed details > summary::-webkit-details-marker { display: none; }
.fc-missed-you { font-size: 13.5px; color: var(--bad); margin-top: 2px; }
.fc-missed-why { margin-top: 8px; font-size: 14.5px; color: var(--ink-2); }
.fc-missed details .fc-code { margin-top: 10px; }
.fc-setting small { color: var(--muted); font-weight: 500; }

.update-bar { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); z-index: 200; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--ink); color: var(--bg); font-weight: 600; box-shadow: var(--shadow-lg); }
.update-bar button { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
html, body { overscroll-behavior-y: none; }
@media (display-mode: standalone) { .fc-home { padding-top: calc(env(safe-area-inset-top, 0px) + 16px); } }
</style>
</head>
<body>
<main id="app"></main>
<p class="offline-note">SQL Cards · version 202610281924 · <span id="net-status"></span></p>
<div id="update-bar" class="update-bar" hidden><span>Update ready.</span><button type="button" id="update-btn">Refresh</button></div>
<script>
(function () {
var highlight = (function () {
// Tiny SQL highlighter + a textarea-over-pre editor. No dependencies.
const KEYWORDS = new Set(`
select from where and or not in is null like ilike between as on join inner left right full outer cross natural using
group by order having limit offset distinct all any some exists case when then else end union intersect except with recursive
insert into values update set delete create table view index drop alter add column primary key foreign references default
unique check constraint asc desc nulls first last over partition rows range unbounded preceding following current row
filter within lateral returning true false interval date time timestamp timestamptz numeric integer int bigint text varchar
boolean real double precision cast explain analyze begin commit rollback similar to escape fetch next only ties window
grouping sets rollup cube materialized if replace temp temporary jsonb json array zone at serial smallint char
`.trim().split(/\s+/));

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const TOKEN = /(--[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|('(?:[^']|'')*'?)|("(?:[^"]|"")*"?)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_][A-Za-z0-9_]*)(\s*\()?|(::|<>|!=|<=|>=|\|\||->>?|#>>?|[=<>+\-*/%])|(\s+)|(.)/g;

function highlight(sql) {
  let out = '';
  sql.replace(TOKEN, (m, comment, str, ident, num, word, paren, op, ws, other) => {
    if (comment) out += `<span class="t-c">${esc(comment)}</span>`;
    else if (str) out += `<span class="t-s">${esc(str)}</span>`;
    else if (ident) out += `<span class="t-i">${esc(ident)}</span>`;
    else if (num) out += `<span class="t-n">${num}</span>`;
    else if (word) {
      const lw = word.toLowerCase();
      if (paren) out += `<span class="t-f">${esc(word)}</span>${esc(paren)}`;
      else if (KEYWORDS.has(lw)) out += `<span class="t-k">${esc(word)}</span>`;
      else out += esc(word);
    }
    else if (op) out += `<span class="t-o">${esc(op)}</span>`;
    else out += esc(ws || other || '');
    return m;
  });
  return out;
}


return highlight;
})();
// Spaced-repetition review: Anki-style scheduling (learning steps, ease factor, lapses)
// plus a phone-first study UI. No imports and no network use, so this same file is
// inlined into the standalone offline build.

const MIN = 60e3, HOUR = 36e5, DAY = 864e5;
const LEARN_STEPS = [1 * MIN, 10 * MIN];
const RELEARN_STEPS = [10 * MIN];
const GRADUATE_DAYS = 1, EASY_DAYS = 4, MAX_DAYS = 3650;
const START_EASE = 2.5, MIN_EASE = 1.3;
const LEARN_AHEAD = 20 * MIN;
const ROLLOVER_HOUR = 4; // a review "day" starts at 4am, like Anki

const GRADES = [
  { g: 1, key: 'again', label: 'Again' },
  { g: 2, key: 'hard', label: 'Hard' },
  { g: 3, key: 'good', label: 'Good' },
  { g: 4, key: 'easy', label: 'Easy' }
];

/* ---------- time helpers ---------- */
function dayStart(t) {
  const d = new Date(t - ROLLOVER_HOUR * HOUR);
  d.setHours(0, 0, 0, 0);
  return d.getTime() + ROLLOVER_HOUR * HOUR;
}
function dayKey(t) {
  const d = new Date(dayStart(t));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function fmtIvl(ms) {
  if (ms < HOUR) return `${Math.max(1, Math.round(ms / MIN))}m`;
  if (ms < DAY) return `${Math.round(ms / HOUR)}h`;
  const d = ms / DAY;
  if (d < 30) return `${Math.round(d)}d`;
  if (d < 365) return `${(d / 30).toFixed(d < 300 ? 1 : 0).replace(/\.0$/, '')}mo`;
  return `${(d / 365).toFixed(1).replace(/\.0$/, '')}y`;
}

/* ---------- scheduler ---------- */
function graduate(c, days, now) {
  c.q = 'review'; c.step = 0;
  c.ivl = Math.min(MAX_DAYS, Math.max(1, Math.round(days)));
  c.due = dayStart(now) + c.ivl * DAY;
}

// Returns a new card state after grading g (1 again, 2 hard, 3 good, 4 easy).
function schedule(card, g, now = Date.now()) {
  const c = { q: 'new', ivl: 0, ease: START_EASE, step: 0, reps: 0, lapses: 0, due: 0, ...card };
  c.reps++;
  if (c.q === 'new') { c.q = 'learn'; c.step = 0; c.ease = START_EASE; }
  if (c.q === 'learn' || c.q === 'relearn') {
    const steps = c.q === 'relearn' ? RELEARN_STEPS : LEARN_STEPS;
    const step = Math.min(c.step, steps.length - 1);
    if (g === 1) { c.step = 0; c.due = now + steps[0]; }
    else if (g === 2) { c.step = step; c.due = now + (step === 0 && steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps[step] * 1.5); }
    else if (g === 3) {
      if (step + 1 < steps.length) { c.step = step + 1; c.due = now + steps[c.step]; }
      else graduate(c, c.q === 'relearn' ? Math.max(1, c.ivl) : GRADUATE_DAYS, now);
    } else graduate(c, c.q === 'relearn' ? Math.max(1, c.ivl) + 1 : EASY_DAYS, now);
    return c;
  }
  // review card
  const late = Math.max(0, (dayStart(now) - c.due) / DAY);
  if (g === 1) {
    c.lapses++;
    c.ease = Math.max(MIN_EASE, c.ease - 0.2);
    c.ivl = Math.max(1, Math.round(c.ivl * 0.2));
    c.q = 'relearn'; c.step = 0; c.due = now + RELEARN_STEPS[0];
    return c;
  }
  const hard = Math.max(c.ivl + 1, Math.round(c.ivl * 1.2));
  const good = Math.max(hard + 1, Math.round((c.ivl + late / 2) * c.ease));
  const easy = Math.max(good + 1, Math.round((c.ivl + late) * c.ease * 1.3));
  if (g === 2) c.ease = Math.max(MIN_EASE, c.ease - 0.15);
  if (g === 4) c.ease += 0.15;
  graduate(c, g === 2 ? hard : g === 3 ? good : easy, now);
  return c;
}

function previewMs(card, g, now) {
  const next = schedule(card, g, now);
  return next.q === 'review' ? next.ivl * DAY : next.due - now;
}

/* ---------- persistence (per-viewer; falls back to memory) ---------- */
function createStore(key) {
  let mem = null;
  const blank = () => ({ v: 1, cards: {}, days: {}, settings: { newPerDay: 15 } });
  const load = () => {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem(key)) || blank(); } catch { mem = blank(); }
    mem.cards = mem.cards || {}; mem.days = mem.days || {}; mem.settings = { newPerDay: 15, ...(mem.settings || {}) };
    return mem;
  };
  const save = () => { try { localStorage.setItem(key, JSON.stringify(mem)); } catch {} };
  return {
    get data() { return load(); },
    save,
    reset() { mem = blank(); save(); },
    exportCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(load())))); },
    importCode(code) {
      const parsed = JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
      if (!parsed || typeof parsed.cards !== 'object') throw new Error('Not a QueryPath backup');
      mem = { ...blank(), ...parsed }; save();
    }
  };
}

/* ---------- UI ---------- */
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const TAG_LABEL = { syntax: 'Syntax', theory: 'Theory', output: 'Predict the output', debug: 'Spot the bug', order: 'Execution order', interview: 'Interview', postgres: 'PostgreSQL' };

function shuffle(a) {
  const r = a.slice();
  for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; }
  return r;
}

function mountReview(root, decks, { storageKey = 'qp.srs.v1', highlight = esc, onSessionChange } = {}) {
  const store = createStore(storageKey);
  // Round-robin across decks, so "All decks" introduces new cards from every topic, not deck 1 first.
  const allCards = [];
  const deckOf = {};
  for (const d of decks) for (const c of d.cards) deckOf[c.id] = d;
  for (let i = 0, more = true; more; i++) {
    more = false;
    for (const d of decks) if (i < d.cards.length) { allCards.push(d.cards[i]); more = true; }
  }
  const state = id => store.data.cards[id] || { q: 'new' };
  let canSave = true;
  try { localStorage.setItem('qp.srs.probe', '1'); canSave = localStorage.getItem('qp.srs.probe') === '1'; localStorage.removeItem('qp.srs.probe'); } catch { canSave = false; }

  function today() {
    const k = dayKey(Date.now());
    const d = store.data.days;
    return (d[k] = d[k] || { reviews: 0, correct: 0, newSeen: 0 });
  }
  function streak() {
    const days = store.data.days;
    let n = 0, t = Date.now();
    if (!(days[dayKey(t)] && days[dayKey(t)].reviews)) t -= DAY; // today not done yet: count from yesterday
    while (days[dayKey(t)] && days[dayKey(t)].reviews) { n++; t -= DAY; }
    return n;
  }
  function counts(cards, now = Date.now()) {
    const end = dayStart(now) + DAY;
    let fresh = 0, learn = 0, due = 0;
    for (const c of cards) {
      const s = state(c.id);
      if (s.q === 'new') fresh++;
      else if (s.q === 'learn' || s.q === 'relearn') { if (s.due <= now + LEARN_AHEAD) learn++; }
      else if (s.due < end) due++;
    }
    return { fresh: Math.min(fresh, newLeft()), freshTotal: fresh, learn, due };
  }
  // The daily new-card limit is shared by all decks (like Anki's parent-deck limit).
  function newLeft() { return Math.max(0, store.data.settings.newPerDay + (today().extraNew || 0) - today().newSeen); }

  // Next card: learning cards that are due, then reviews due today, then new cards (daily cap).
  function nextCard(cards, now = Date.now()) {
    let bestLearn = null, bestReview = null, firstNew = null;
    const end = dayStart(now) + DAY;
    for (const c of cards) {
      const s = state(c.id);
      if (s.q === 'learn' || s.q === 'relearn') { if (s.due <= now && (!bestLearn || s.due < state(bestLearn.id).due)) bestLearn = c; }
      else if (s.q === 'review') { if (s.due < end && (!bestReview || s.due < state(bestReview.id).due)) bestReview = c; }
      else if (!firstNew) firstNew = c;
    }
    if (bestLearn) return bestLearn;
    if (bestReview) return bestReview;
    if (firstNew && newLeft() > 0) return firstNew;
    // nothing else left: allow learning cards due within the learn-ahead window
    let ahead = null;
    for (const c of cards) {
      const s = state(c.id);
      if ((s.q === 'learn' || s.q === 'relearn') && s.due <= now + LEARN_AHEAD && (!ahead || s.due < state(ahead.id).due)) ahead = c;
    }
    return ahead;
  }
  function nextDueAt(cards) {
    let t = Infinity;
    for (const c of cards) { const s = state(c.id); if (s.q !== 'new' && s.due < t) t = s.due; }
    return t;
  }

  /* ----- home ----- */
  function renderHome() {
    closeSession();
    const all = counts(allCards);
    const t = today();
    const acc = t.reviews ? Math.round(t.correct / t.reviews * 100) : null;
    const learned = allCards.filter(c => state(c.id).q !== 'new').length;
    const mature = allCards.filter(c => state(c.id).ivl >= 21).length;
    const totalDue = all.fresh + all.learn + all.due;
    root.innerHTML = `
      <div class="fc-home">
        <section class="fc-hero">
          <div class="fc-hero-top"><div class="fc-kicker">Daily review · works offline</div><button type="button" class="fc-gear" data-act="settings" aria-label="Settings and backup">⚙︎ Settings</button></div>
          <h1>Review</h1>
          ${learned ? '' : `<p class="fc-lead">${allCards.length} cards across ${decks.length} decks. Clear today's reviews first, then learn a few new cards. Five minutes a day beats an hour on Sunday.</p>`}
          ${canSave ? '' : `<p class="fc-warn">This viewer can't save progress between visits. Use Settings → Copy code before you close it.</p>`}
          <div class="fc-stats">
            <div><b>${streak()}</b><span>day streak</span></div>
            <div><b>${t.reviews}</b><span>reviews today</span></div>
            <div><b>${acc === null ? '–' : acc + '%'}</b><span>pass rate today</span></div>
            <div><b>${learned}</b><span>cards started</span></div>
          </div>
          <button type="button" class="fc-btn fc-primary fc-study" data-act="study" ${totalDue ? '' : 'disabled'}>
            ${totalDue ? `Study now <span class="fc-counts">${countPills(all)}</span>` : 'All caught up for today ✓'}
          </button>
          ${totalDue ? '' : `<p class="fc-sub">${nextDueText(allCards)}</p><div class="fc-row fc-more"><button type="button" class="fc-btn fc-ghost" data-act="more-new">Learn 10 more</button><button type="button" class="fc-btn fc-ghost" data-act="quiz">Quick quiz</button></div>`}
        </section>

        <section class="fc-decks" aria-label="Decks">
          <div class="fc-section-h"><h2>Decks</h2><span class="fc-legend"><span class="fc-n fc-new">New</span><span class="fc-n fc-learn">Learning</span><span class="fc-n fc-due">Due</span></span></div>
          <p class="fc-sub fc-limit-note">${newLeft()} of ${store.data.settings.newPerDay + (t.extraNew || 0)} new cards left today, shared across decks.</p>
          <ul>${decks.map(d => {
            const k = counts(d.cards);
            const started = d.cards.filter(c => state(c.id).q !== 'new').length;
            const pct = Math.round(started / d.cards.length * 100);
            const idle = !(k.fresh + k.learn + k.due);
            return `<li class="fc-deck${idle ? ' is-idle' : ''}">
              <button type="button" class="fc-deck-main" data-act="study" data-deck="${d.id}">
                <span class="fc-deck-emoji" aria-hidden="true">${d.emoji}</span>
                <span class="fc-deck-text"><span class="fc-deck-name">${esc(d.name)}</span><span class="fc-deck-blurb">${esc(d.blurb)}</span>
                  <span class="fc-bar" aria-label="${pct}% started"><span style="width:${pct}%"></span></span></span>
                ${idle ? '<span class="fc-idle">✓ Done</span>' : `<span class="fc-counts">${countPills(k)}</span>`}
              </button>
              <button type="button" class="fc-quiz-btn" data-act="quiz" data-deck="${d.id}" aria-label="Quiz: ${esc(d.name)}">Quiz</button>
            </li>`;
          }).join('')}</ul>
          <button type="button" class="fc-btn fc-ghost fc-quiz-all" data-act="quiz">Mixed quiz · 15 random questions</button>
        </section>

        <details class="fc-panel">
          <summary>How to review like a warrior</summary>
          <ol class="fc-rules">
            <li><strong>Never skip a day.</strong> Reviews pile up fast. Five minutes on the train beats an hour on Sunday.</li>
            <li><strong>Reviews before new cards.</strong> Study now always clears what's due first, then adds new cards.</li>
            <li><strong>Grade honestly.</strong> A wrong answer always counts as Again. Got it right but slowly? Hard. Right with a little thought? Good. Instant? Easy.</li>
            <li><strong>Keep new cards small.</strong> 10 to 20 a day keeps daily reviews under 15 minutes. Raise it only when reviews feel light.</li>
            <li><strong>Read the explanation on every miss.</strong> The "why" is the lesson. Then move on; the card comes back in minutes.</li>
          </ol>
          <p class="fc-sub">Intervals grow each time you remember: 1 minute → 10 minutes → 1 day → 3 days → a week and beyond. Forgotten cards drop back into short steps.</p>
        </details>

        <details class="fc-panel" id="fc-settings">
          <summary>Settings & backup</summary>
          <div class="fc-setting">
            <span>New cards per day <small>(all decks)</small></span>
            <span class="fc-stepper"><button type="button" data-act="new-minus" aria-label="Fewer new cards">−</button><b data-new-limit>${store.data.settings.newPerDay}</b><button type="button" data-act="new-plus" aria-label="More new cards">+</button></span>
          </div>
          <p class="fc-sub">Progress is saved on this device only. ${learned} started · ${mature} mature (21+ day interval). To move progress to another device or the offline copy, copy a backup code here and restore it there.</p>
          <div class="fc-row"><button type="button" class="fc-btn fc-ghost" data-act="backup">Copy code</button><button type="button" class="fc-btn fc-ghost" data-act="restore-open">Restore</button></div>
          <div class="fc-msg" aria-live="polite"></div>
          <div class="fc-restore" hidden>
            <textarea id="fc-restore-input" rows="3" placeholder="Paste a backup code" aria-label="Backup code"></textarea>
            <button type="button" class="fc-btn fc-primary" data-act="restore">Restore progress</button>
          </div>
          <button type="button" class="fc-link-danger" data-act="reset">Reset all review progress</button>
        </details>
      </div>`;
  }

  function countPills(k, labels) {
    return `<span class="fc-n fc-new" title="New">${k.fresh}</span><span class="fc-n fc-learn" title="Learning">${k.learn}</span><span class="fc-n fc-due" title="Due">${k.due}</span>`;
  }
  function nextDueText(cards) {
    const t = nextDueAt(cards);
    if (!isFinite(t)) return 'No reviews scheduled yet.';
    const ms = t - Date.now();
    return ms <= 0 ? 'More cards are ready.' : `Next review in ${fmtIvl(ms)}.`;
  }

  /* ----- session overlay ----- */
  let session = null;
  function openOverlay() {
    let ov = document.querySelector('.fc-session');
    if (!ov) {
      ov = document.createElement('div');
      ov.className = 'fc-session';
      ov.setAttribute('role', 'dialog');
      ov.setAttribute('aria-modal', 'true');
      document.body.appendChild(ov);
    }
    document.documentElement.classList.add('fc-locked');
    // a history entry, so an iOS back-swipe ends the session instead of leaving the page
    if (!(history.state && history.state.fcSession)) { try { history.pushState({ fcSession: true }, ''); } catch {} }
    onSessionChange && onSessionChange(true);
    return ov;
  }
  function exitSession() {
    if (history.state && history.state.fcSession) history.back(); // popstate renders home
    else renderHome();
  }
  function closeSession() {
    session = null;
    const ov = document.querySelector('.fc-session');
    if (ov) ov.remove();
    document.documentElement.classList.remove('fc-locked');
    onSessionChange && onSessionChange(false);
  }

  function shell(ov, { title, right = '', progress = 0 }) {
    ov.innerHTML = `
      <div class="fc-top">
        <button type="button" class="fc-x" data-act="exit" aria-label="End session">✕</button>
        <div class="fc-top-title">${esc(title)}</div>
        <div class="fc-top-right">${right}</div>
      </div>
      <div class="fc-progress"><span style="width:${Math.round(progress * 100)}%"></span></div>
      <div class="fc-scroll"><article class="fc-card"></article></div>
      <div class="fc-actions"></div>`;
    return { card: ov.querySelector('.fc-card'), actions: ov.querySelector('.fc-actions'), scroll: ov.querySelector('.fc-scroll') };
  }

  const QUEUE_LABEL = { new: 'New', learn: 'Learning', relearn: 'Relearning', review: 'Review' };
  function cardBody(c, order, queue) {
    const tag = `<div class="fc-meta"><span class="fc-tags"><span class="fc-tag fc-tag-${c.tag}">${TAG_LABEL[c.tag] || c.tag}</span>${queue ? `<span class="fc-queue fc-queue-${queue}">${QUEUE_LABEL[queue]}</span>` : ''}</span><span class="fc-deckname">${deckOf[c.id].emoji} ${esc(deckOf[c.id].name)}</span></div>`;
    const code = c.code ? `<pre class="fc-code"><code>${highlight(c.code.trim())}</code></pre>` : '';
    if (c.type === 'recall') return `${tag}<div class="fc-q">${c.front}</div>${code}<div class="fc-back" hidden><div class="fc-divider"></div>${c.back}</div>`;
    return `${tag}<div class="fc-q">${c.q}</div>${code}
      <div class="fc-options" role="group" aria-label="Answers">${order.map((oi, i) =>
        `<button type="button" class="fc-opt" data-opt="${oi}"><span class="fc-opt-k">${i + 1}</span><span class="fc-opt-t">${c.options[oi]}</span></button>`).join('')}</div>
      <div class="fc-why" hidden></div>`;
  }

  function startStudy(deckId) {
    const cards = deckId ? decks.find(d => d.id === deckId).cards : allCards;
    session = { mode: 'study', cards, deckId, title: deckId ? decks.find(d => d.id === deckId).name : 'All decks', done: 0 };
    showNext();
  }

  function showNext(forced) {
    const ov = openOverlay();
    const s = session;
    const c = forced || nextCard(s.cards);
    const k = counts(s.cards);
    if (!c) return showDone(ov);
    s.current = c;
    s.revealed = false;
    s.order = c.type === 'mcq' ? shuffle([0, 1, 2, 3]) : null;
    const st = state(c.id);
    const remaining = k.fresh + k.learn + k.due;
    const { card, actions, scroll } = shell(ov, {
      title: s.title,
      right: `${s.undo ? '<button type="button" class="fc-undo" data-act="undo" aria-label="Undo last answer">↶ Undo</button>' : ''}<span class="fc-counts">${countPills(k)}</span>`,
      progress: s.done / (s.done + remaining || 1)
    });
    card.innerHTML = cardBody(c, s.order, st.q);
    card.dataset.queue = st.q;
    scroll.scrollTop = 0;
    s.shownAt = Date.now();
    if (c.type === 'recall') {
      actions.innerHTML = `<button type="button" class="fc-btn fc-primary fc-wide" data-act="show">Show answer</button>`;
    } else {
      actions.innerHTML = `<p class="fc-hint">Pick an answer</p>`;
    }
  }

  function reveal(chosen) {
    const s = session, c = s.current;
    if (!s || s.revealed) return;
    s.revealed = true;
    const ov = document.querySelector('.fc-session');
    const actions = ov.querySelector('.fc-actions');
    let correct = true;
    if (c.type === 'mcq') {
      correct = chosen === c.answer;
      ov.querySelectorAll('.fc-opt').forEach(b => {
        const oi = +b.dataset.opt;
        b.disabled = true;
        if (oi === c.answer) b.classList.add('is-correct');
        else if (oi === chosen) b.classList.add('is-wrong');
        else b.classList.add('is-dim');
      });
      const why = ov.querySelector('.fc-why');
      why.hidden = false;
      why.innerHTML = `<div class="fc-verdict ${correct ? 'ok' : 'no'}">${correct ? '✓ Correct' : '✗ Not quite'}</div>${c.why}`;
      requestAnimationFrame(() => why.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
    } else {
      ov.querySelector('.fc-back').hidden = false;
    }
    s.correct = correct;
    const st = state(c.id), now = Date.now();
    // honest grading: a wrong multiple-choice answer can only be "Again"
    // honest grading: a wrong multiple-choice answer can only be "Again", and a slow first answer can't be "Easy"
    let grades = c.type === 'mcq' && !correct ? GRADES.slice(0, 1) : GRADES;
    if (c.type === 'mcq' && correct && st.q === 'new' && Date.now() - s.shownAt > 8000) grades = GRADES.slice(0, 3);
    actions.innerHTML = `<div class="fc-grades${grades.length === 1 ? ' single' : ''}">${grades.map(x =>
      `<button type="button" class="fc-grade fc-${x.key}" data-grade="${x.g}"><span>${x.label}</span><small>${fmtIvl(previewMs(st, x.g, now))}</small></button>`).join('')}</div>`;
  }

  function grade(g) {
    const s = session;
    if (!s || !s.revealed) return;
    const c = s.current;
    const t = today();
    const before = state(c.id);
    s.undo = { card: c, prev: store.data.cards[c.id], day: { ...t } };
    if (before.q === 'new') t.newSeen++;
    t.reviews++;
    if (g > 1) t.correct++;
    store.data.cards[c.id] = schedule(before, g, Date.now());
    store.save();
    s.done++;
    showNext();
  }

  function showDone(ov) {
    const s = session;
    const t = today();
    const { card, actions } = shell(ov, { title: s.title, progress: 1 });
    card.classList.add('fc-done');
    card.innerHTML = `<div class="fc-done-emoji" aria-hidden="true">🏁</div>
      <h2>${s.done ? 'Session complete' : 'Nothing due right now'}</h2>
      <p>${s.done ? `You reviewed ${s.done} card${s.done === 1 ? '' : 's'} this session.` : 'This deck has no cards due and no new cards left for today.'}</p>
      <div class="fc-stats small">
        <div><b>${streak()}</b><span>day streak</span></div>
        <div><b>${t.reviews}</b><span>today</span></div>
        <div><b>${t.reviews ? Math.round(t.correct / t.reviews * 100) + '%' : '–'}</b><span>correct</span></div>
      </div>
      <p class="fc-sub">${nextDueText(s.cards)}</p>`;
    actions.innerHTML = `<div class="fc-row">${newLeft() === 0 && s.cards.some(c => state(c.id).q === 'new') ? '<button type="button" class="fc-btn fc-ghost" data-act="more-new">Learn 10 more</button>' : ''}<button type="button" class="fc-btn fc-ghost" data-act="quiz-from-done">${s.deckId ? 'Quiz this deck' : 'Take a quiz'}</button><button type="button" class="fc-btn fc-primary" data-act="exit">Done</button></div>`;
  }

  /* ----- quiz mode (no scheduling, just practice) ----- */
  function startQuiz(deckId) {
    const pool = (deckId ? decks.find(d => d.id === deckId).cards : allCards).filter(c => c.type === 'mcq');
    const qs = shuffle(pool).slice(0, deckId ? Math.min(10, pool.length) : 15);
    session = { mode: 'quiz', qs, i: 0, score: 0, missed: [], title: `Quiz · ${deckId ? decks.find(d => d.id === deckId).name : 'Mixed'}` };
    showQuiz();
  }
  function showQuiz() {
    const ov = openOverlay();
    const s = session;
    if (s.i >= s.qs.length) return showQuizEnd(ov);
    const c = s.current = s.qs[s.i];
    s.revealed = false;
    s.order = shuffle([0, 1, 2, 3]);
    const { card, actions, scroll } = shell(ov, { title: s.title, right: `<span class="fc-quiz-pos">${s.i + 1}/${s.qs.length}</span>`, progress: s.i / s.qs.length });
    card.innerHTML = cardBody(c, s.order);
    scroll.scrollTop = 0;
    actions.innerHTML = `<p class="fc-hint">Pick an answer</p>`;
  }
  function quizReveal(chosen) {
    const s = session, c = s.current;
    if (s.revealed) return;
    s.revealed = true;
    const ov = document.querySelector('.fc-session');
    const ok = chosen === c.answer;
    if (ok) s.score++; else s.missed.push({ c, chosen });
    ov.querySelectorAll('.fc-opt').forEach(b => {
      const oi = +b.dataset.opt; b.disabled = true;
      b.classList.add(oi === c.answer ? 'is-correct' : oi === chosen ? 'is-wrong' : 'is-dim');
    });
    const why = ov.querySelector('.fc-why');
    why.hidden = false;
    why.innerHTML = `<div class="fc-verdict ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✗ Not quite'}</div>${c.why}`;
    requestAnimationFrame(() => why.scrollIntoView({ block: 'nearest', behavior: 'smooth' }));
    ov.querySelector('.fc-actions').innerHTML = `<button type="button" class="fc-btn fc-primary fc-wide" data-act="quiz-next">${s.i + 1 < s.qs.length ? 'Next question' : 'See results'}</button>`;
  }
  function showQuizEnd(ov) {
    const s = session;
    const pct = Math.round(s.score / s.qs.length * 100);
    const { card, actions } = shell(ov, { title: s.title, progress: 1 });
    card.classList.add('fc-done');
    card.innerHTML = `<div class="fc-done-emoji" aria-hidden="true">${pct === 100 ? '🏆' : pct >= 70 ? '🎯' : '📚'}</div>
      <h2>${s.score} / ${s.qs.length} correct</h2>
      <p>${pct === 100 ? 'Flawless.' : pct >= 70 ? 'Solid. Review the misses below.' : 'These need work. Send the misses to your review queue.'}</p>
      ${s.missed.length ? `<ul class="fc-missed">${s.missed.map(({ c, chosen }) => `<li><details><summary><div class="fc-missed-q">${c.q}</div><div class="fc-missed-a">Answer: ${c.options[c.answer]}</div><div class="fc-missed-you">You picked: ${c.options[chosen]}</div></summary>${c.code ? `<pre class="fc-code"><code>${highlight(c.code.trim())}</code></pre>` : ''}<div class="fc-missed-why">${c.why}</div></details></li>`).join('')}</ul>` : ''}`;
    actions.innerHTML = `<div class="fc-row">${s.missed.length ? `<button type="button" class="fc-btn fc-ghost" data-act="queue-missed">Redo misses</button>` : ''}<button type="button" class="fc-btn fc-primary" data-act="exit">Done</button></div>`;
  }
  function queueMissed() {
    const now = Date.now();
    for (const c of session.missed) {
      const st = state(c.id);
      store.data.cards[c.id] = st.q === 'new' ? schedule(st, 1, now - LEARN_STEPS[0]) : { ...st, due: Math.min(st.due, now), q: st.q === 'review' ? 'relearn' : st.q, step: 0 };
    }
    store.save();
    const missedIds = new Set(session.missed.map(c => c.id));
    session = { mode: 'study', cards: allCards.filter(c => missedIds.has(c.id)), title: 'Missed questions', done: 0 };
    showNext();
  }

  /* ----- events ----- */
  function onClick(e) {
    const t = e.target.closest('[data-act], [data-opt], [data-grade]');
    if (!t) return;
    if (t.dataset.opt !== undefined) {
      if (!session) return;
      return session.mode === 'quiz' ? quizReveal(+t.dataset.opt) : reveal(+t.dataset.opt);
    }
    if (t.dataset.grade) return grade(+t.dataset.grade);
    const act = t.dataset.act;
    const msg = root.querySelector('.fc-msg');
    switch (act) {
      case 'study': startStudy(t.dataset.deck); break;
      case 'settings': { const p = root.querySelector('#fc-settings'); p.open = true; p.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'more-new': today().extraNew = (today().extraNew || 0) + 10; store.save(); if (session) { session.done = session.done; showNext(); } else startStudy(); break;
      case 'quiz': startQuiz(t.dataset.deck); break;
      case 'quiz-from-done': startQuiz((session && session.deckId) || undefined); break;
      case 'show': reveal(); break;
      case 'quiz-next': session.i++; showQuiz(); break;
      case 'queue-missed': queueMissed(); break;
      case 'exit': exitSession(); break;
      case 'undo': {
        const u = session && session.undo;
        if (!u) break;
        if (u.prev) store.data.cards[u.card.id] = u.prev; else delete store.data.cards[u.card.id];
        store.data.days[dayKey(Date.now())] = u.day;
        store.save();
        session.undo = null;
        session.done = Math.max(0, session.done - 1);
        showNext(u.card);
        break;
      }
      case 'new-minus': case 'new-plus': {
        const s = store.data.settings;
        s.newPerDay = Math.max(0, Math.min(100, s.newPerDay + (act === 'new-plus' ? 5 : -5)));
        store.save();
        root.querySelector('[data-new-limit]').textContent = s.newPerDay; // update in place so the stepper doesn't jump
        const note = root.querySelector('.fc-limit-note');
        if (note) note.textContent = `${newLeft()} of ${s.newPerDay + (today().extraNew || 0)} new cards left today, shared across decks.`;
        break;
      }
      case 'backup': {
        const code = store.exportCode();
        const done = ok => { msg.textContent = ok ? 'Backup code copied. Paste it into Restore on your other device.' : 'Copy this code:'; if (!ok) { const ta = root.querySelector('#fc-restore-input'); root.querySelector('.fc-restore').hidden = false; ta.value = code; ta.select(); } };
        try { navigator.clipboard.writeText(code).then(() => done(true), () => done(false)); } catch { done(false); }
        break;
      }
      case 'restore-open': root.querySelector('.fc-restore').hidden = false; root.querySelector('#fc-restore-input').focus(); break;
      case 'restore':
        if (!t.dataset.armed) {
          let n = '?';
          try { n = Object.keys(JSON.parse(decodeURIComponent(escape(atob(root.querySelector('#fc-restore-input').value.trim())))).cards || {}).length; } catch { msg.textContent = 'That code did not work. Copy the whole backup code and try again.'; break; }
          t.dataset.armed = '1';
          t.textContent = `Replace ${Object.keys(store.data.cards).length} cards here with ${n} from the code?`;
          break;
        }
        try { store.importCode(root.querySelector('#fc-restore-input').value); renderHome(); openPanel(1); root.querySelector('.fc-msg').textContent = 'Progress restored.'; }
        catch { msg.textContent = 'That code did not work. Copy the whole backup code and try again.'; }
        break;
      case 'reset':
        if (t.dataset.armed) { store.reset(); renderHome(); }
        else { t.dataset.armed = '1'; t.textContent = 'Tap again to erase all review progress'; }
        break;
    }
  }
  function openPanel(i) { const p = root.querySelectorAll('.fc-panel')[i]; if (p) p.open = true; }
  function onKey(e) {
    if (!session || /input|textarea/i.test(document.activeElement.tagName)) return;
    const n = parseInt(e.key, 10);
    if (e.key === 'Escape') { exitSession(); return; }
    if (!session.revealed) {
      if (session.current && session.current.type === 'mcq' && n >= 1 && n <= 4) {
        const oi = session.order[n - 1];
        session.mode === 'quiz' ? quizReveal(oi) : reveal(oi);
      } else if ((e.key === ' ' || e.key === 'Enter') && session.current && session.current.type === 'recall') { e.preventDefault(); reveal(); }
    } else if (session.mode === 'study' && n >= 1 && n <= 4 && document.querySelector(`.fc-grade[data-grade="${n}"]`)) grade(n);
    else if (session.mode === 'study' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); const b = document.querySelector('.fc-grade.fc-good') || document.querySelector('.fc-grade'); b && grade(+b.dataset.grade); }
    else if (session.mode === 'quiz' && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); session.i++; showQuiz(); }
  }

  const onPop = () => { if (session) renderHome(); };
  window.addEventListener('popstate', onPop);
  root.addEventListener('click', onClick);
  const ovClick = e => { if (e.target.closest('.fc-session')) onClick(e); };
  document.addEventListener('click', ovClick);
  document.addEventListener('keydown', onKey);
  renderHome();
  return {
    destroy() {
      closeSession();
      root.removeEventListener('click', onClick);
      document.removeEventListener('click', ovClick);
      document.removeEventListener('keydown', onKey);
      window.removeEventListener('popstate', onPop);
    },
    // test hooks
    _store: store, _schedule: schedule
  };
}

      why: `Double quotes make an identifier, so spaces are allowed. Unquoted, first name parses as column first with alias name; single quotes return the text; brackets are SQL Server.` },

    { id: 'select-filter-24', type: 'mcq', tag: 'syntax',
      q: `Which literal is the string O'Reilly in standard PostgreSQL?`,
      options: [`"O'Reilly"`, `'O"Reilly'`, `'O\\'Reilly'`, `'O''Reilly'`],
      answer: 3,
      why: `A single quote inside a string is doubled. Backslash escaping works only in E'...' strings, not in regular ones, and double quotes would make an identifier.` },

    { id: 'select-filter-r01', type: 'recall', tag: 'theory',
      front: `Rank NOT, AND and OR from highest to lowest precedence.`,
      back: `NOT first, then AND, then OR. So <code>a OR b AND c</code> means <code>a OR (b AND c)</code>. Add parentheses whenever you mix AND and OR.` },

    { id: 'select-filter-r02', type: 'recall', tag: 'syntax',
      front: `Write a filter for all of March 2025 on a timestamp column ts.`,
      back: `<code>ts &gt;= '2025-03-01' AND ts &lt; '2025-04-01'</code><br>A half-open range avoids the BETWEEN end-of-day trap.` },

    { id: 'select-filter-r03', type: 'recall', tag: 'postgres',
      front: `Where do NULLs sort by default with ORDER BY in PostgreSQL?`,
      back: `NULL counts as the largest value: last for ASC, first for DESC. Override with <code>NULLS FIRST</code> or <code>NULLS LAST</code>.` },

    { id: 'select-filter-r04', type: 'recall', tag: 'syntax',
      front: `What do the LIKE wildcards % and _ match?`,
      back: `<code>%</code> matches any run of characters, even none; <code>_</code> matches exactly one character.` },

    { id: 'select-filter-r05', type: 'recall', tag: 'interview',
      front: `In PostgreSQL, what do single quotes make, and what do double quotes make?`,
      back: `Single quotes make string literals (<code>'Ada'</code>); double quotes make identifiers (<code>"Total"</code>).` }
  ]
});
DECKS.push({
  id: 'null-types',
  name: 'NULLs & Data Types',
  emoji: '🚫',
  blurb: 'Three-valued logic, COALESCE, NOT IN traps, numeric types, casts, dates.',
  cards: [
    { id: 'null-types-01', type: 'mcq', tag: 'debug',
      q: `What does this return?`,
      code: `SELECT count(*)
FROM (VALUES (1), (NULL)) AS t(x)
WHERE x = NULL;`,
      options: [`0`, `1`, `2`, `Error: use IS NULL`],
      answer: 0,
      why: `x = NULL evaluates to NULL for every row, and WHERE keeps only true rows. Use x IS NULL. PostgreSQL does not raise an error for = NULL; it silently matches nothing.` },

    { id: 'null-types-02', type: 'mcq', tag: 'theory',
      q: `What does this return?`,
      code: `SELECT NULL AND false AS r;`,
      options: [`NULL`, `false`, `true`, `Error: NULL is not boolean`],
      answer: 1,
      why: `Three-valued logic: false AND anything is false, since no value of the unknown could make it true. NULL AND true would be NULL.` },

    { id: 'null-types-03', type: 'mcq', tag: 'output',
      q: `What does this return?`,
      code: `SELECT 5 + NULL AS r;`,
      options: [`5`, `0`, `NULL`, `Error: type mismatch`],
      answer: 2,
      why: `Any arithmetic with NULL yields NULL, because the result is unknown. NULL is not treated as 0.` },

    { id: 'null-types-04', type: 'mcq', tag: 'output',
      q: `What does this return?`,
      code: `SELECT 'a'::text || NULL || 'b' AS r;`,
      options: [`'ab'`, `'a'`, `'anullb'`, `NULL`],
      answer: 3,
      why: `The || operator returns NULL if either side is NULL. It does not skip the NULL, and it never writes the word null.` },

    { id: 'null-types-05', type: 'mcq', tag: 'postgres',
      q: `What does the function concat('a', NULL, 'b') return in PostgreSQL?`,
      options: [`'ab'`, `NULL`, `'a'`, `'anullb'`],
      answer: 0,
      why: `concat() ignores NULL arguments, unlike the || operator, which returns NULL. It does not insert the text null.` },

    { id: 'null-types-06', type: 'mcq', tag: 'syntax',
      q: `Which standard function replaces a NULL score with 0 in PostgreSQL?`,
      options: [`NVL(score, 0)`, `COALESCE(score, 0)`, `IFNULL(score, 0)`, `NULLIF(score, 0)`],
      answer: 1,
      why: `COALESCE returns its first non-NULL argument and works in PostgreSQL. NVL is Oracle, IFNULL is MySQL, and NULLIF does the reverse: it turns 0 into NULL.` },

    { id: 'null-types-07', type: 'mcq', tag: 'output',
      q: `What does this return?`,
      code: `SELECT COALESCE(NULLIF('', ''), 'n/a');`,
      options: [`NULL`, `an empty string`, `n/a`, `an error`],
      answer: 2,
      why: `NULLIF('', '') returns NULL because its arguments are equal, so COALESCE falls through to 'n/a'. An empty string is not NULL, so COALESCE alone would keep it.` },

    { id: 'null-types-08', type: 'mcq', tag: 'output',
      q: `What does this return?`,
      code: `SELECT NULL IS DISTINCT FROM NULL AS r;`,
      options: [`NULL`, `true`, `Error: NULL has no type`, `false`],
      answer: 3,
      why: `IS DISTINCT FROM treats two NULLs as equal, so they are not distinct and the result is false. Plain NULL <> NULL would return NULL.` },

    { id: 'null-types-09', type: 'mcq', tag: 'output',
      q: `What does this return?`,
      code: `SELECT count(*)
FROM generate_series(1, 3) AS n
WHERE n NOT IN (1, NULL);`,
      options: [`0`, `2`, `3`, `Error: NULL not allowed in IN`],
      answer: 0,
      why: `n NOT IN (1, NULL) means n <> 1 AND n <> NULL. The second test is never true, so for n = 2 and 3 the result is NULL and no rows pass. The tempting answer is 2.` },

    { id: 'null-types-10', type: 'mcq', tag: 'postgres',
      q: `What do these row-value tests return?`,
      code: `SELECT (1, NULL) IS NULL AS a,

      options: [`a = true, b = false`, `a = false, b = true`, `a = false, b = false`, `a = true, b = true`],
      answer: 2,
      why: `For a row, IS NULL is true only if every field is NULL, and IS NOT NULL only if every field is non-NULL. A mixed row fails both, so they are not inverses.` },

    { id: 'null-types-11', type: 'mcq', tag: 'output',
      q: `What are a and b?`,
      code: `SELECT count(*) AS a, count(x) AS b
FROM (VALUES (1), (NULL), (3)) AS t(x);`,
      options: [`a = 3, b = 3`, `a = 2, b = 2`, `a = 3, b = 2`, `a = 2, b = 3`],

    { id: 'null-types-12', type: 'mcq', tag: 'output',

FROM (VALUES (10), (NULL), (30)) AS t(x);`,
      options: [`13.33`, `10`, `NULL`, `20`],
      answer: 3,

    { id: 'null-types-13', type: 'mcq', tag: 'output',
      q: `What are a and b?`,
      code: `SELECT 1 IN (1, NULL) AS a,

      options: [`a = true, b = NULL`, `a = true, b = false`, `a = NULL, b = NULL`, `a = true, b = true`],
      answer: 0,

    { id: 'null-types-14', type: 'mcq', tag: 'postgres',
      q: `By default in PostgreSQL, how many NULLs can a UNIQUE column hold?`,
      options: [`Only one`, `Any number`, `None; UNIQUE implies NOT NULL`, `At most two`],
      answer: 1,
      why: `NULLs are never equal to each other, so they never violate UNIQUE. PostgreSQL 15+ can change this with NULLS NOT DISTINCT. NOT NULL is implied only by PRIMARY KEY.` },

    { id: 'null-types-15', type: 'mcq', tag: 'output',
      q: `How many rows does this return?`,

WHERE NOT (x = 1);`,
      options: [`3`, `2`, `1`, `0`],
      answer: 2,

    { id: 'null-types-16', type: 'mcq', tag: 'output',
      q: `What does this return?`,
      code: `SELECT 7 / 2 AS r;`,
      options: [`3.5`, `4`, `3.0`, `3`],
      answer: 3,
      why: `Both operands are integers, so PostgreSQL does integer division and truncates to 3. Use 7 / 2.0 or 7::numeric / 2 to get 3.5.` },

    { id: 'null-types-17', type: 'mcq', tag: 'output',
      q: `What does this return?`,
      code: `SELECT 0.1::float8 + 0.2::float8 = 0.3 AS r;`,
      options: [`false`, `true`, `NULL`, `Error: float8 = numeric`],
      answer: 0,
      why: `float8 stores binary approximations, so 0.1 + 0.2 is 0.30000000000000004, not 0.3. The same sum in numeric is exact and gives true.` },

    { id: 'null-types-18', type: 'mcq', tag: 'postgres',
      q: `Which cast form is standard SQL rather than PostgreSQL-specific?`,
      options: [`price::numeric`, `CAST(price AS numeric)`, `price TO numeric`, `(numeric) price`],
      answer: 1,
      why: `CAST(expr AS type) is standard and portable. expr::type is a PostgreSQL shorthand with the same effect. The other two forms are not valid PostgreSQL.` },

    { id: 'null-types-19', type: 'mcq', tag: 'debug',
      q: `What happens in PostgreSQL?`,
      code: `SELECT '12abc'::int;`,
      noRun: true,
      options: [`Returns 12, ignoring the trailing text`, `Returns NULL`, `Error: invalid input syntax for type integer`, `Returns 0`],
      answer: 2,
      why: `PostgreSQL is strict: a failed text-to-integer cast raises an error instead of truncating or returning NULL, as some other databases do.` },

    { id: 'null-types-20', type: 'mcq', tag: 'postgres',
      q: `What does a timestamptz value actually store in PostgreSQL?`,
      options: [`Local clock time plus the time zone name`, `Local clock time plus the numeric UTC offset`, `Local clock time with no zone information`, `A UTC instant, shown in the session time zone`],
      answer: 3,
      why: `timestamptz stores one absolute instant (internally UTC) and renders it in the session TimeZone. No zone name or offset is kept. timestamp, without tz, is the plain local-time type.` },

    { id: 'null-types-21', type: 'mcq', tag: 'output',

       + INTERVAL '1 month' AS r;`,
      options: [`2025-02-28 00:00:00`, `2025-03-03 00:00:00`, `2025-03-01 00:00:00`, `Error: day out of range`],
      answer: 0,
      why: `Adding months keeps the day when possible and otherwise clamps to the end of the month, so Jan 31 plus 1 month is Feb 28. It does not overflow into March.` },

    { id: 'null-types-22', type: 'mcq', tag: 'postgres',
      q: `What does this return?`,
      code: `SELECT 'off'::boolean AS r;`,
      options: [`true`, `false`, `NULL`, `Error: invalid boolean`],
      answer: 1,
      why: `PostgreSQL accepts 'off', 'no', 'f', 'false', 'n' and '0' as false, and the matching spellings as true. It does not treat any non-empty string as true.` },

    { id: 'null-types-r01', type: 'recall', tag: 'theory',
      front: `Which AND / OR combinations with NULL do not give NULL?`,
      back: `<code>NULL AND false</code> = false and <code>NULL OR true</code> = true. Every other combination with NULL gives NULL.` },

    { id: 'null-types-r02', type: 'recall', tag: 'syntax',
      front: `How do you compare a and b so that two NULLs count as equal?`,
      back: `<code>a IS NOT DISTINCT FROM b</code>. Plain <code>a = b</code> gives NULL when either side is NULL. <code>IS DISTINCT FROM</code> is the negation.` },

    { id: 'null-types-r03', type: 'recall', tag: 'syntax',
      front: `What does <code>COALESCE(a, b, c)</code> return?`,

      front: `For money amounts, why use numeric instead of float?`,

DECKS.push({
  id: 'aggregation',
  name: 'Aggregation & GROUP BY',
  emoji: '📊',
  blurb: 'COUNT variants, NULLs, GROUP BY rules, HAVING, FILTER.',
  cards: [
    { id: 'aggregation-01', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `WITH t(x) AS (VALUES (1),(NULL),(1))
SELECT count(1) FROM t;`,
      options: [`2`, `3`, `1`, `NULL`],
      answer: 1,
      why: `count(1) counts a non-NULL constant, so every row counts, including the one whose x is NULL. It behaves like count(*). Only count(x) would skip the NULL and return 2.` },
    { id: 'aggregation-02', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `WITH t(x) AS (VALUES (1),(NULL),(1),(2))
SELECT count(DISTINCT x) FROM t;`,
      options: [`2`, `3`, `4`, `1`],
      answer: 0,
      why: `DISTINCT removes the duplicate 1, and count ignores NULL, leaving {1, 2}. 3 is tempting if you treat NULL as one more distinct value, but aggregates skip NULLs.` },
    { id: 'aggregation-03', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `WITH t(x) AS (VALUES (10),(10),(40))
SELECT round(avg(DISTINCT x)) FROM t;`,
      options: [`10`, `20`, `40`, `25`],
      answer: 3,
      why: `DISTINCT is applied before avg, so the inputs are 10 and 40 and the average is 25. Plain avg(x) would give 20, the tempting answer.` },
    { id: 'aggregation-04', type: 'mcq', tag: 'postgres',
      q: `In PostgreSQL, what type does avg() return when its input is an integer column?`,
      options: [`numeric`, `integer`, `double precision`, `bigint`],
      answer: 0,
      why: `For smallint, integer and bigint inputs avg() returns numeric, so the fraction is kept. integer is the tempting answer, but PostgreSQL does not truncate averages of integers.` },
    { id: 'aggregation-05', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `SELECT sum(x) / count(*)
FROM (VALUES (1),(2)) t(x);`,
      options: [`1.5`, `2`, `NULL`, `1`],
      answer: 3,
      why: `sum and count both return bigint, so / is integer division: 3 / 2 truncates to 1. 1.5 is tempting; use avg(x) or cast one side to numeric to keep the fraction.` },
    { id: 'aggregation-06', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `SELECT count(*), sum(x)
FROM (VALUES (1),(2)) t(x)
WHERE x > 5;`,
      options: [`count 0, sum 0`, `count NULL, sum NULL`, `count 0, sum NULL`, `no rows at all`],
      answer: 2,
      why: `Without GROUP BY an aggregate query always returns one row. count gives 0 on empty input, but sum, avg, min and max give NULL. "count 0, sum 0" is tempting but wrong.` },
    { id: 'aggregation-07', type: 'mcq', tag: 'output',
      q: `How many rows does this query return?`,
      code: `SELECT count(*)
FROM (VALUES (1),(2)) t(x)
WHERE x > 5
GROUP BY x;`,
      options: [`One row: 0`, `One row: NULL`, `An error`, `No rows`],
      answer: 3,
      why: `GROUP BY returns one row per group, and no input rows means no groups. "One row: 0" is tempting, but that only happens when there is no GROUP BY.` },
    { id: 'aggregation-08', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `WITH t(x) AS (VALUES (3),(NULL),(7))
SELECT max(x) FROM t;`,
      options: [`NULL`, `7`, `3`, `10`],
      answer: 1,
      why: `max ignores NULLs and returns 7. NULL is tempting because ORDER BY ... DESC puts NULLs first, but aggregates skip NULL inputs entirely.` },
    { id: 'aggregation-09', type: 'mcq', tag: 'postgres',
      q: `In PostgreSQL, which expression makes sum(x) return 0 instead of NULL when no rows match the WHERE?`,
      options: [`COALESCE(sum(x), 0)`, `sum(COALESCE(x, 0))`, `NULLIF(sum(x), 0)`, `IFNULL(sum(x), 0)`],
      answer: 0,
      why: `COALESCE around the aggregate replaces the NULL that sum returns for empty input. sum(COALESCE(x, 0)) is tempting but still sums zero rows, which gives NULL. IFNULL does not exist in PostgreSQL.` },
    { id: 'aggregation-10', type: 'mcq', tag: 'debug', noRun: true,
      q: `Why does this query fail in PostgreSQL?`,
      code: `SELECT department_id, last_name,
       count(*)
FROM employees
GROUP BY department_id;`,
      options: [`count(*) needs a column argument with GROUP BY`, `last_name is neither grouped nor aggregated`, `GROUP BY must list columns in SELECT order`, `department_id contains NULLs`],
      answer: 1,
      why: `Every selected column must be in GROUP BY or inside an aggregate, and last_name is neither. Several employees in a department have different last names, so no single value exists.` },
    { id: 'aggregation-11', type: 'mcq', tag: 'postgres',
      q: `Does this query run in PostgreSQL?`,
      code: `SELECT employee_id, last_name,
       count(*)
FROM employees
GROUP BY employee_id;`,
      options: [`No, last_name must be in GROUP BY`, `Yes, last_name depends on the primary key`, `Yes, but only if last_name is NOT NULL`, `No, count(*) can't mix with columns`],
      answer: 1,
      why: `employee_id is the primary key, so every other column of employees is functionally dependent on it and may be selected ungrouped. "last_name must be in GROUP BY" is the general rule, but this is the exception.` },
    { id: 'aggregation-12', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `SELECT x / 3 AS bucket, count(*)
FROM generate_series(1, 6) x
GROUP BY x / 3
ORDER BY bucket;`,
      options: [`(1, 3), (2, 3)`, `(0, 3), (1, 3)`, `(0, 2), (1, 2), (2, 2)`, `(0, 2), (1, 3), (2, 1)`],
      answer: 3,
      why: `Integer division truncates: 1 and 2 give bucket 0; 3, 4 and 5 give 1; 6 gives 2. The expression is the grouping key, so equal quotients land in one group.` },
    { id: 'aggregation-13', type: 'mcq', tag: 'syntax',
      q: `In PostgreSQL, what does GROUP BY 1 do?`,
      options: [`It groups by the first SELECT-list item`, `It groups by the table's first column`, `It puts all rows into one group`, `It is an error: 1 is a constant`],
      answer: 0,
      why: `An integer in GROUP BY (like in ORDER BY) is a position in the SELECT list. "The table's first column" is tempting, but the position refers to the select list, not the table definition.` },
    { id: 'aggregation-14', type: 'mcq', tag: 'debug', noRun: true,
      q: `Why does this query fail?`,
      code: `SELECT department_id
FROM employees
WHERE count(*) > 3
GROUP BY department_id;`,
      options: [`count(*) must be written count(1) in WHERE`, `WHERE can't be combined with GROUP BY`, `WHERE runs before grouping, so no count exists yet`, `department_id must be inside an aggregate`],
      answer: 2,
      why: `WHERE filters individual rows before groups are formed, so aggregates are not allowed there. Use HAVING count(*) > 3. Combining WHERE with GROUP BY is perfectly legal.` },
    { id: 'aggregation-15', type: 'mcq', tag: 'interview',
      q: `A filter on a grouping column (department_id = 1) works in WHERE or HAVING. Which is the better habit?`,
      options: [`HAVING, because the query uses GROUP BY`, `HAVING, because WHERE can't see grouped columns`, `Neither; it belongs in the ON clause`, `WHERE, since it discards rows before grouping`],
      answer: 3,
      why: `WHERE states the intent: drop rows before grouping, leaving HAVING for aggregate conditions. PostgreSQL's planner often pushes such a HAVING down anyway, but WHERE is clearer and portable.` },
    { id: 'aggregation-16', type: 'mcq', tag: 'debug', noRun: true,
      q: `Why does this query fail in PostgreSQL?`,
      code: `SELECT department_id, count(*) AS n
FROM employees
GROUP BY department_id
HAVING n > 3;`,
      options: [`HAVING can't use SELECT aliases; repeat count(*)`, `The alias n must be quoted`, `HAVING requires an ORDER BY`, `count(*) AS n is illegal with GROUP BY`],
      answer: 0,
      why: `HAVING is evaluated before the SELECT list, so the alias n does not exist yet: write HAVING count(*) > 3. GROUP BY and ORDER BY may use output aliases, which is why this feels like it should work.` },
    { id: 'aggregation-17', type: 'mcq', tag: 'interview',
      q: `How do SELECT DISTINCT a FROM t and SELECT a FROM t GROUP BY a compare?`,
      options: [`GROUP BY drops the NULL group; DISTINCT keeps it`, `GROUP BY sorts its output; DISTINCT never does`, `DISTINCT is always faster than GROUP BY`, `Same rows; GROUP BY also allows aggregates`],
      answer: 3,
      why: `Both collapse duplicates and treat all NULLs as one value; GROUP BY additionally lets you compute aggregates per group. GROUP BY does not drop NULLs, and neither guarantees sorted output.` },
    { id: 'aggregation-18', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `SELECT x, count(*)
FROM (VALUES (1),(NULL),(NULL)) t(x)
GROUP BY x
ORDER BY x;`,
      options: [`Two rows: (1, 1) and (NULL, 2)`, `One row: (1, 1)`, `Three rows: one per input row`, `Two rows: (1, 1) and (NULL, 1)`],
      answer: 0,
      why: `GROUP BY puts all NULLs into a single group, so the NULL group has count 2. Three rows is tempting because NULL = NULL is not true in comparisons, but grouping treats NULLs as equal.` },
    { id: 'aggregation-19', type: 'mcq', tag: 'syntax',
      q: `Which PostgreSQL syntax counts only the rows where x &gt; 1 inside a larger aggregate query?`,
      options: [`count(*) WHERE x &gt; 1`, `count(*) FILTER x &gt; 1`, `count(*) FILTER (WHERE x &gt; 1)`, `count(*) HAVING (x &gt; 1)`],
      answer: 2,
      why: `The aggregate FILTER clause takes a parenthesized WHERE condition and applies to just that aggregate. HAVING filters whole groups, not the rows going into one aggregate.` },
    { id: 'aggregation-20', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `SELECT sum(CASE WHEN x > 5 THEN 1 END)
FROM generate_series(1, 3) x;`,
      options: [`1`, `0`, `An error`, `NULL`],
      answer: 3,
      why: `With no ELSE, unmatched rows give NULL, and the sum of only NULLs is NULL. 0 is tempting; add ELSE 0, wrap in COALESCE, or use count(*) FILTER, which does return 0.` },
    { id: 'aggregation-21', type: 'mcq', tag: 'output',
      q: `What does this query return?`,
      code: `SELECT count(CASE WHEN x > 1
                THEN 1 ELSE 0 END)
FROM generate_series(1, 4) x;`,
      options: [`3`, `4`, `1`, `0`],
      answer: 1,
      why: `count counts non-NULL values, and ELSE 0 makes every row non-NULL, so all 4 rows are counted. 3 is what was intended; use sum(...) with ELSE 0, or drop the ELSE.` },
    { id: 'aggregation-22', type: 'mcq', tag: 'interview',
      q: `x is an integer column. Which expression gives x as a fractional percent of the column total?`,
      options: [`x / sum(x) OVER () * 100`, `x * 100 / sum(x) OVER ()`, `100.0 * x / sum(x) OVER ()`, `100 * (x / sum(x) OVER ())`],
      answer: 2,
      why: `100.0 forces numeric division. The others use integer division: x / sum(x) is 0 for any row but the whole total, and x * 100 / sum(x) truncates the fraction (the tempting one).` },
    { id: 'aggregation-23', type: 'mcq', tag: 'postgres',
      q: `What does this query return?`,
      code: `SELECT count(*)
FROM generate_series(1, 3) x
HAVING count(*) > 5;`,
      options: [`One row: 3`, `No rows`, `One row: 0`, `An error`],
      answer: 1,
      why: `Without GROUP BY, HAVING filters the single whole-table group. count is 3, which fails > 5, so no rows come back. An error is tempting, but HAVING without GROUP BY is legal.` },
    { id: 'aggregation-24', type: 'mcq', tag: 'order',
      q: `Which clause is evaluated right after GROUP BY?`,

    { id: 'subqueries-19', type: 'mcq', tag: 'theory',

      options: [`Run in parallel with the other FROM items`, `Return more than one column`, `Reference columns of FROM items listed before it`, `Skip the alias requirement`],
      answer: 2,
      why: `LATERAL lets the subquery refer to earlier FROM items, evaluated per row (like a correlated subquery, but in FROM and able to return many rows). It has nothing to do with parallelism.` },

    { id: 'subqueries-20', type: 'mcq', tag: 'syntax',
      q: `How do you keep outer rows whose LATERAL subquery returns nothing?`,
      options: [`LEFT JOIN LATERAL (...) s ON true`, `LEFT JOIN LATERAL (...) s, with no ON`, `FULL LATERAL (...) s`, `CROSS JOIN LATERAL (...) s`],
      answer: 0,
      why: `A LEFT JOIN needs an ON clause, so use ON true; unmatched outer rows then get NULLs. CROSS JOIN LATERAL drops outer rows that find no match.` },

    { id: 'subqueries-21', type: 'mcq', tag: 'interview',
      q: `Customers with at least one order, each listed once: why prefer EXISTS over a plain JOIN to orders?`,
      options: [`EXISTS always runs faster than any JOIN`, `A JOIN cannot filter on another table's rows`, `A JOIN repeats a customer once per matching order`, `EXISTS also returns the order columns`],
      answer: 2,
      why: `EXISTS only tests for a match, so each customer appears once. A JOIN fans out to one row per order, forcing a DISTINCT. EXISTS is not always faster, though.` },

    { id: 'subqueries-22', type: 'mcq', tag: 'interview',
      q: `One filtered aggregate is needed in two places of a query. What is the cleanest approach?`,
      options: [`Copy the same subquery into both places`, `Write it once as a CTE and reference it twice`, `Use a correlated subquery at each place`, `Self-join the base table to reuse it`],
      answer: 1,
      why: `A CTE names the logic once, so it is readable and cannot drift between copies. Repeated subqueries duplicate code and work; a plain JOIN is the better fit for just combining tables.` },

    { id: 'subqueries-r01', type: 'recall', tag: 'interview',
      front: `Why can <code>x NOT IN (subquery)</code> return no rows, and what is the safe alternative?`,
      back: `If the subquery returns any NULL, <code>NOT IN</code> evaluates to NULL (not true) for every row. Use <code>NOT EXISTS</code> (or filter NULLs out of the subquery).` },

    { id: 'subqueries-r02', type: 'recall', tag: 'debug',

    { id: 'subqueries-r04', type: 'recall', tag: 'postgres',

    { id: 'subqueries-r05', type: 'recall', tag: 'postgres',
      front: `PostgreSQL 12+: what do <code>MATERIALIZED</code> and <code>NOT MATERIALIZED</code> do to a CTE?`,
      back: `<code>MATERIALIZED</code> computes the CTE once and stores it (a fence). <code>NOT MATERIALIZED</code> allows inlining so outer filters can be pushed in. Default: inline if used once, materialize if used more than once.` }

    { id: 'windows-04', type: 'mcq', tag: 'theory',
      q: `With ORDER BY inside OVER and no frame clause, what is the default frame?`,

      answer: 1,
      why: `The default is RANGE from the partition start to the current row, which includes peers (ties). Without ORDER BY the frame is the whole partition; ROWS must be written explicitly.` },

    { id: 'windows-05', type: 'mcq', tag: 'output',
      q: `What is the running sum column?`,
      code: `SELECT v, sum(v) OVER (ORDER BY v)
FROM (VALUES (1),(2),(2),(3)) t(v);`,
      options: [`1, 3, 5, 8`, `1, 5, 5, 8`, `1, 3, 3, 8`, `8, 8, 8, 8`],

    { id: 'windows-06', type: 'mcq', tag: 'output',
      q: `What are the rank() values, top to bottom?`,
      code: `SELECT v,
  rank() OVER (ORDER BY v DESC) r
FROM (VALUES (30),(20),(20),(10)) t(v);`,
      options: [`1, 2, 2, 3`, `1, 3, 3, 4`, `1, 2, 2, 4`, `1, 2, 3, 4`],
      answer: 2,
      why: `rank() gives ties the same rank and then skips: after two 2s, the next rank is 4. Without gaps (1, 2, 2, 3) is dense_rank().` },

    { id: 'windows-07', type: 'mcq', tag: 'output',
      q: `What are the dense_rank() values, top to bottom?`,
      code: `SELECT v,
  dense_rank() OVER (ORDER BY v) r

      options: [`1, 1, 1, 2`, `1, 1, 1, 4`, `1, 2, 3, 4`, `1, 2, 2, 3`],
      answer: 0,
